openapi: 3.1.0
info:
  title: Nightjar API
  version: 0.2.0
  description: |
    Public API contract. Server handlers and the web client are built against
    this file. v0: libraries, items, playback info, direct-play streams, and
    HLS playback sessions (ADR-0011).
  license:
    name: GPL-3.0-only
servers:
  - url: http://localhost:8096
    description: Local default
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v0/libraries:
    get:
      operationId: listLibraries
      summary: List all libraries
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
    post:
      operationId: createLibrary
      summary: Create a library and enqueue its first scan (ADR-0015)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: >
            Library created and scan job accepted. The walk runs asynchronously
            (ADR-0004); poll GET /scan-jobs/{jobId} for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLibraryResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}:
    get:
      operationId: getLibrary
      summary: Get one library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: patchLibrary
      summary: Update library name and/or repoint library root (ADR-0030)
      description: >
        Name-only updates return 200 with the library. A path change accepts an
        async repoint job (202) that dry-runs a full walk against a 0.90 retain
        guard before committing `libraries.path` and enqueueing a normal scan.
        Refusal reasons appear on the job error
        (`repoint_empty_match` | `repoint_below_retain_threshold`). No force
        override in v1. Path PATCH work is scan-class duration (two walks).
        Phase 1–2: unauthenticated (ADR-0003). Phase 3: admin-only — this
        mutates the library root and must not stay public after accounts land
        (ADR-0030).
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLibraryRequest"
      responses:
        "200":
          description: Name-only update applied (no path change)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "202":
          description: Path repoint job accepted; poll GET /scan-jobs/{jobId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobAccepted"
        "400":
          description: Invalid request or active job already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/scan:
    post:
      operationId: scanLibrary
      summary: Start an async library scan job (ADR-0004)
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "202":
          description: Scan job accepted (or existing active job returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobAccepted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/scan-jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Poll scan job state and counts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Scan job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/items:
    get:
      operationId: listLibraryItems
      summary: List media items in a library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}:
    get:
      operationId: getItem
      summary: Get one media item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/candidates:
    get:
      operationId: searchMetadataCandidates
      summary: Search TMDB candidates for manual metadata fix (ADR-0028)
      description: >
        Pre-accounts local-trust. Block 2 accounts work must make this
        admin-only first — assign rewrites watch state across profiles.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Override search title (default cleaned filename title)
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataCandidatesResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/assign:
    post:
      operationId: assignMetadata
      summary: Assign a TMDB id (manual match, ADR-0028)
      description: >
        Ignores the 0.80 auto-match floor. Runs the ADR-0025 item_key migrator.
        Pre-accounts local-trust; must become admin-only with accounts.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataAssignRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataAssignResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/clear:
    post:
      operationId: clearMetadataMatch
      summary: Clear provider match; return to path item_key (ADR-0028)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataClearResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/retry:
    post:
      operationId: retryMetadataMatch
      summary: Bust negative-result cache and re-queue automatic match (ADR-0028)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Queued pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataRetryResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/artwork/{itemKey}/{kind}:
    get:
      operationId: getArtwork
      summary: Serve cached artwork for an item_key (ADR-0027)
      parameters:
        - name: itemKey
          in: path
          required: true
          schema:
            type: string
          description: Opaque item_key (e.g. tmdb:movie:550)
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [poster, backdrop, banner, logo, still]
        - name: w
          in: query
          required: false
          schema:
            type: integer
            enum: [342, 780]
          description: Derived width; omitted serves original when present
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/playback-info:
    get:
      operationId: getPlaybackInfo
      summary: Playback method and delivery URL for an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MaxBitrateBps"
        - $ref: "#/components/parameters/MaxHeight"
        - $ref: "#/components/parameters/ProfileHdr"
      responses:
        "200":
          description: Playback info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/subtitles/{trackId}.vtt:
    get:
      operationId: getSubtitleVtt
      summary: WebVTT for one text subtitle track (ADR-0010)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: trackId
          in: path
          required: true
          description: >
            Stable track id (ADR-0010): `e{streamIndex}` for embedded,
            `s` / `s-{suffix}` for filesystem sidecars.
          schema:
            type: string
            pattern: '^[es]([A-Za-z0-9._-]*)$'
      responses:
        "200":
          description: WebVTT body
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: Item or serveable subtitle track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/stream:
    get:
      operationId: streamItem
      summary: Byte stream for playback (supports HTTP Range)
      description: >
        Serves the original file for directPlay items. Remux and transcode
        items are delivered as HLS sessions (ADR-0011). Honours profileId
        (ADR-0022); default BROWSER_V0 keeps today's 415 on Matroska for
        anonymous browser callers.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MaxBitrateBps"
        - $ref: "#/components/parameters/MaxHeight"
        - $ref: "#/components/parameters/ProfileHdr"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Entire file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Item needs an HLS session; POST /api/v0/items/{itemId}/sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          description: Range not satisfiable

  /api/v0/items/{itemId}/sessions:
    post:
      operationId: startTranscodeSession
      summary: Start an HLS playback session for an item
      description: >
        ADR-0011 / ADR-0020. Returns 202 with sessionId and playlistUrl
        (per-run master under /runs/{runId}/master.m3u8). Remux items get a
        stream-copy session, transcode items a re-encoding one; the shape is
        identical. Far seek uses POST /sessions/{sessionId}/seek?startMs=,
        which returns a fresh playlistUrl. Concurrent sessions are capped via
        NIGHTJAR_HLS_MAX_SESSIONS (default 3).
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: startMs
          in: query
          required: false
          description: Encode window start in milliseconds (default 0)
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MaxBitrateBps"
        - $ref: "#/components/parameters/MaxHeight"
        - $ref: "#/components/parameters/ProfileHdr"
        - name: audioTrackId
          in: query
          required: false
          description: >
            Audio track to map, from playbackInfo.audioTracks (ADR-0012).
            Defaults to the flagged default track, else the first. Switching
            audio starts a new session at the current position and DELETEs the
            old one. On an otherwise DirectPlay title, an over-ceiling track
            starts a hybrid session (ADR-0012 / ADR-0018).
          schema:
            type: string
            pattern: '^e[0-9]+$'
        - name: subtitleTrackId
          in: query
          required: false
          description: >
            Burn-in subtitle track from playbackInfo.subtitleTracks with
            render=burnIn (ADR-0018). Soft (WebVTT) tracks are selected via
            MEDIA / track elements, not this param. Switching burn-in starts
            a new session at the current position and DELETEs the old one.
            Selecting burn-in on a DirectPlay title starts a transcode
            session.
          schema:
            type: string
      responses:
        "202":
          description: Session started for this item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: >
            Item direct plays without a track selection that requires encode,
            or is not ready for a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Session cap full; retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/runs/{runId}/master.m3u8:
    get:
      operationId: getSessionMasterPlaylist
      summary: HLS master playlist for a producer run
      description: >
        ADR-0020. Declares the single video rendition (index.m3u8) and optional
        SUBTITLES group. playlistUrl from session start / seek points here.
        Far seek is POST /seek, not a startMs query on this URI.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: HLS master playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session or run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Playlist not ready yet (no mapped segments)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/runs/{runId}/index.m3u8:
    get:
      operationId: getSessionPlaylist
      summary: HLS media playlist for a producer run
      description: >
        Assembled from the session-global time-keyed segment map (ADR-0020).
        Segment URIs are session-root relative (`../../seg_<ms>.m4s` from
        `/runs/{runId}/index.m3u8`). EVENT while
        cooking; ENDLIST at that run's EOF. EXT-X-START is window-relative.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session or run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Playlist not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/runs/{runId}/init.mp4:
    get:
      operationId: getSessionRunInit
      summary: fMP4 init segment for a producer run
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Init segment bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Session or run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Init not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/subs/{asset}:
    get:
      operationId: getSessionSubtitlePlaylist
      summary: Subtitle media playlist or WebVTT segment for a session track
      description: >
        ADR-0010 / ADR-0013. EXT-X-MEDIA URI target. Ready tracks use a
        multi-segment `{trackId}.m3u8` whose `segNNN.vtt` bodies are sliced
        from the item store VTT (no session demux). Cold session-inline
        demux remains for fixtures only; Gate-1 snapshots only declare
        complete/store tracks.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: asset
          in: path
          required: true
          description: >
            `{trackId}.m3u8` or `{trackId}/segNNN.vtt` (e.g. e2.m3u8,
            e2/seg000.vtt, s-en/seg012.vtt)
          schema:
            type: string
            pattern: '^[es][A-Za-z0-9._-]*(?:\.m3u8|/seg[0-9]+\.vtt)$'
      responses:
        "200":
          description: HLS subtitle media playlist or WebVTT segment
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
        "404":
          description: Session or track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Subtitle segment not ready yet (demux still catching up)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/{asset}:
    get:
      operationId: getSessionAsset
      summary: HLS init segment or media segment for a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: asset
          in: path
          required: true
          schema:
            type: string
            pattern: '^(init\.mp4|seg_[0-9]{11}\.m4s)$'
        - name: njFetcher
          in: query
          required: false
          description: >
            Log-only client marker. Serving ignores this. Attach-wait probes
            may set it (`attach-wait`); Safari's native HLS engine does not.
            Distinguishes probe traffic from WebKit segment GETs in dogfood
            logs without changing 200/503/204 behaviour. Far scrub is
            POST /seek (ADR-0020) — clients must not poke segment URIs to
            force cooking.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: Segment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "204":
          description: >
            Abandoned or superseded segment GET held with no fill until the
            session idle ceiling while the session lived; empty body
            (ADR-0011). Not an application error. Distinct from DELETE
            session 204.
        "404":
          description: Session or asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Segment not on disk yet (encoder still cooking). Retryable; do not
            treat as a permanent miss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/seek:
    post:
      operationId: seekTranscodeSession
      summary: Far scrub — new producer run and playlist URI
      description: >
        ADR-0020. Applies startMs, starts a new run when needed, and returns
        the fresh playlistUrl. Clients must swap the player source to that URI
        (hls.js loadSource / Safari native re-attach). Track selections do not
        survive the swap; re-apply after attach.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: startMs
          in: query
          required: true
          description: Title-absolute play land in milliseconds
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "202":
          description: Seek applied (or already at this land)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}:
    get:
      operationId: getTranscodeSession
      summary: Current session snapshot
      description: >
        playlistUrl, landedMs, and usableExtentMs when known (ADR-0020).
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTranscodeSession
      summary: Stop a playback session and reap its FFmpeg process
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Stopped (or already gone)
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/system/transcode:
    get:
      operationId: getTranscodeCapabilities
      summary: Verified H.264 encode capabilities for this process
      description: >
        Startup detection-by-verification (ADR-0009). Each candidate is
        verified | failed | unavailable with a reason when not verified.
        preferredH264Encoder is the encoder name from the preferred encode leg
        (ADR-0009). optional preferredDevice is the render node when the leg
        binds one (e.g. VAAPI).
      responses:
        "200":
          description: Capability readout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeCapabilities"

components:
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    ProfileId:
      name: profileId
      in: query
      required: false
      description: >
        Client capability profile id (ADR-0022). Known ids: BROWSER_V0,
        MEDIA3_V0, MPV_V0, AETHER_V0. Omitted or unknown with no field bag
        falls back to BROWSER_V0. Optional maxBitrateBps / maxHeight / hdr
        override the named floor (unknown id + bag still decides).
      schema:
        type: string
        minLength: 1
    MaxBitrateBps:
      name: maxBitrateBps
      in: query
      required: false
      description: >
        Field-bag override (ADR-0022). Source video bitrate above this forces
        transcode at or under the ceiling. null / omitted leaves the named
        profile value.
      schema:
        type: integer
        format: int64
        minimum: 1
    MaxHeight:
      name: maxHeight
      in: query
      required: false
      description: >
        Field-bag override (ADR-0022). Source height above this forces
        transcode with scale. null / omitted leaves the named profile value.
      schema:
        type: integer
        minimum: 1
    ProfileHdr:
      name: hdr
      in: query
      required: false
      description: Field-bag override for highest accepted HDR (ADR-0022).
      schema:
        $ref: "#/components/schemas/HdrCapability"

  schemas:
    HdrCapability:
      type: string
      enum: [none, hdr10, dolbyVision]
      description: >
        Highest HDR the client accepts (ADR-0022). Source above this forces
        transcode with a real tone-map graph (zscale + hable) when encoding.

    ClientCapabilityProfile:
      type: object
      description: >
        Wire shape for a reported profile (ADR-0022). Named ids cover the
        common engines; unknown id may send maxBitrateBps / maxHeight / hdr
        as query overrides (field bag). Codec lists on the bag are a later
        additive slice.
      properties:
        profileId:
          type: string
        maxBitrateBps:
          type: integer
          format: int64
          nullable: true
          description: Source video bitrate above this forces transcode. null = no ceiling.
        maxHeight:
          type: integer
          nullable: true
          description: Source height above this forces transcode. null = no ceiling.
        hdr:
          $ref: "#/components/schemas/HdrCapability"

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        core:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LibraryKind:
      type: string
      enum: [movies, shows]

    MediaKind:
      type: string
      enum: [movie, episode, unknown]

    ProbeStatus:
      type: string
      enum: [indexed, probed, error, unavailable]
      description: >
        indexed = walk+filename done, codecs pending; probed = ffprobe ok;
        error = permanent ffprobe/parse failure (see scanError);
        unavailable = mount/IO absence, retriable (ADR-0014).

    SubtitleStatus:
      type: string
      enum: [pending, ready, none, error, unavailable]
      description: >
        Item-level extract queue state (ADR-0013 / ADR-0014). pending =
        extract queued or in progress; ready = WebVTT on disk; none = no
        serveable text tracks; error = permanent extract failure; unavailable
        = mount/IO absence, retriable. Per-track first-play readiness is
        SubtitleTrack.readiness, not this field.

    SubtitleTrackReadiness:
      type: string
      enum: [preparing, partial, complete]
      description: >
        Server-declared per-track readiness for serveable text tracks
        (ADR-0013 §11). preparing = extract not yet writing cues; partial =
        a growing WebVTT is serveable; complete = final WebVTT. Clients never
        invent this from file size or a timer. Absent on burnIn tracks
        (ADR-0018).

    ScanJobState:
      type: string
      enum: [queued, indexing, probing, completed, failed]

    PlaybackMethod:
      type: string
      enum: [directPlay, remux, transcode]
      description: >
        directPlay = browser plays the original file; remux = same codecs in a
        container the client cannot open, delivered as a stream-copy HLS
        session; transcode = needs re-encoding, delivered as an encoding HLS
        session. Pending or failed probes report transcode.

    TranscodeSession:
      type: object
      required: [sessionId, itemId, playlistUrl, videoEncoder, encoderKind, landedMs]
      properties:
        sessionId:
          type: string
        itemId:
          type: integer
          format: int64
        playlistUrl:
          type: string
          description: >
            Path to the current run's HLS master playlist
            (/sessions/{id}/runs/{runId}/master.m3u8). Fresh URI per far seek
            (ADR-0020).
        videoEncoder:
          type: string
          description: >
            FFmpeg encoder currently used by this session, or "copy" when the
            session stream-copies video (remux).
        encoderKind:
          type: string
          enum: [hardware, software, copy]
          description: >
            Whether videoEncoder is a hardware encoder, a software encoder, or
            a stream copy.
        landedMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Producer-observed land (first mapped segment start for the current
            run), title-absolute milliseconds.
        usableExtentMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            When a producer reaches EOF materially short of the container's
            claimed duration, the usable media end in milliseconds. Absent when
            unknown or undamaged.

    Library:
      type: object
      required:
        - id
        - name
        - path
        - kind
        - itemCount
        - reachable
        - pathsUnresolved
        - skippedOutsideRoot
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        itemCount:
          type: integer
          format: int64
        reachable:
          type: boolean
          description: >
            False when the library root is not reachable (unmounted share,
            missing path). Work is paused until it returns (ADR-0014).
        pathsUnresolved:
          type: integer
          format: int64
          description: >
            Rows still stored as absolute paths after migration / pending
            repair under the current root (ADR-0030).
        skippedOutsideRoot:
          type: integer
          format: int64
          description: >
            Last index pass count of walked files outside the library root
            (symlink escape / bind overlap); visible, not log-only (ADR-0030).

    PatchLibraryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
          description: >
            Candidate library root for async repoint. Must be an existing
            directory. Same path as current (after normalize) is a no-op.

    CreateLibraryRequest:
      type: object
      required: [name, path, kind]
      properties:
        name:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/LibraryKind"

    CreateLibraryResponse:
      type: object
      required:
        - id
        - name
        - path
        - kind
        - itemCount
        - reachable
        - pathsUnresolved
        - skippedOutsideRoot
        - jobId
      description: >
        Library row plus the scan job enqueued on create (ADR-0015).
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        itemCount:
          type: integer
          format: int64
        reachable:
          type: boolean
        pathsUnresolved:
          type: integer
          format: int64
        skippedOutsideRoot:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
          description: Async scan job started for this library.

    MetadataCandidate:
      type: object
      required: [provider, kind, id, title]
      properties:
        provider:
          type: string
          enum: [tmdb]
        kind:
          type: string
          enum: [movie, tv]
        id:
          type: integer
          format: int64
        title:
          type: string
        year:
          type: integer
          nullable: true

    MetadataCandidatesResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MetadataCandidate"

    MetadataAssignRequest:
      type: object
      required: [kind, id]
      properties:
        provider:
          type: string
          enum: [tmdb]
          default: tmdb
        kind:
          type: string
          enum: [movie, tv]
        id:
          type: integer
          format: int64
          description: TMDB movie id or TV series id

    MetadataAssignResponse:
      type: object
      required: [itemKey, mediaItemId]
      properties:
        itemKey:
          type: string
        mediaItemId:
          type: integer
          format: int64

    MetadataClearResponse:
      type: object
      required: [itemKey, mediaItemId]
      properties:
        itemKey:
          type: string
        mediaItemId:
          type: integer
          format: int64

    MetadataRetryResponse:
      type: object
      required: [mediaItemId, status]
      properties:
        mediaItemId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending]

    MediaItem:
      type: object
      required: [id, libraryId, path, title, kind, sizeBytes, probeStatus, subtitleStatus, metadataStatus, playbackMethod]
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        path:
          type: string
          description: >
            Absolute filesystem path reconstructed at response time from the
            current library root and stored relpath (ADR-0030). Not stable
            across library repoint — use `id` for identity.
        title:
          type: string
        kind:
          $ref: "#/components/schemas/MediaKind"
        year:
          type: integer
          nullable: true
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        sizeBytes:
          type: integer
          format: int64
        probeStatus:
          $ref: "#/components/schemas/ProbeStatus"
        subtitleStatus:
          $ref: "#/components/schemas/SubtitleStatus"
        metadataStatus:
          $ref: "#/components/schemas/MetadataStatus"
        scanError:
          type: string
          nullable: true
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"

    MetadataStatus:
      type: string
      enum: [pending, matched, ready, unmatched]
      description: >
        Metadata pipeline state (ADR-0026). `pending` = search tier queued;
        `matched` = identity found, detail enrichment pending; `ready` = full
        metadata bound; `unmatched` = search terminal no-match.

    ScanJobAccepted:
      type: object
      required: [jobId, libraryId]
      properties:
        jobId:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64

    ScanJob:
      type: object
      required:
        - id
        - libraryId
        - state
        - added
        - updated
        - removed
        - unchanged
        - probed
        - errors
        - startedAt
        - kind
        - skippedOutsideRoot
        - deferredRemove
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ScanJobState"
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
        probed:
          type: integer
        errors:
          type: integer
        indexDurationMs:
          type: integer
          format: int64
          nullable: true
          description: Wall time of the index pass; Gate 1 measures this.
        probeDurationMs:
          type: integer
          format: int64
          nullable: true
        error:
          type: string
          nullable: true
          description: >
            Failure message. Repoint refusals use stable prefixes
            `repoint_empty_match` or `repoint_below_retain_threshold` (ADR-0030).
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        kind:
          type: string
          description: "`scan` or `repoint` (ADR-0030)."
          enum: [scan, repoint]
        candidatePath:
          type: string
          nullable: true
          description: Candidate root for a repoint job; absent on ordinary scans.
        skippedOutsideRoot:
          type: integer
          format: int64
          description: >
            Files walked but not indexed because they were outside the library
            root (ADR-0030).
        deferredRemove:
          type: integer
          format: int64
          description: >
            On `kind=repoint` jobs: count of existing media rows that missed
            the new root keep-set and were left in place (delete_missing
            deferred to the next ordinary scan). Zero on ordinary scans
            (ADR-0030).

    PlaybackInfo:
      type: object
      required: [itemId, playbackMethod, reason, mimeType, subtitleStatus]
      properties:
        itemId:
          type: integer
          format: int64
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"
        reason:
          type: string
          description: Why the decision engine chose this method
        streamUrl:
          type: string
          description: Present only when playbackMethod is directPlay
        sessionsUrl:
          type: string
          description: >
            Present when playbackMethod is remux or transcode. POST here to
            start an HLS session (ADR-0011).
        mimeType:
          type: string
          description: >
            Source MIME for directPlay; application/vnd.apple.mpegurl for
            session playback.
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        audioTracks:
          type: array
          description: >
            Audio tracks in the source (ADR-0012). Listed the same way for
            directPlay, remux, and transcode: the client asks for a trackId
            and never reasons about the delivery path to find tracks. Direct
            play switches client-side; sessions take audioTrackId at start.
          items:
            $ref: "#/components/schemas/AudioTrack"
        subtitleStatus:
          $ref: "#/components/schemas/SubtitleStatus"
        subtitleTracks:
          type: array
          description: >
            Subtitle tracks (ADR-0010 / ADR-0013 / ADR-0018). Soft text and
            burn-in (ASS/SSA/PGS) share one shape; differ by render. Soft
            tracks expose url when WebVTT is extracted; burnIn tracks are
            selected via subtitleTrackId on session start. Listed the same
            way for directPlay, remux, and transcode.
          items:
            $ref: "#/components/schemas/SubtitleTrack"

    AudioTrack:
      type: object
      required: [trackId, codec, channels, default, streamIndex]
      properties:
        trackId:
          type: string
          description: >
            Stable id `e{streamIndex}`, the same scheme as embedded subtitles
            (ADR-0010 / ADR-0012).
          pattern: '^e[0-9]+$'
        codec:
          type: string
          description: Source codec (aac, ac3, eac3, dts, ...)
        language:
          type: string
          nullable: true
          description: Normalised ISO 639-1 when known; null if unlabelled
        channels:
          type: integer
          minimum: 1
          description: >
            Channel count. Tracks above the client ceiling are downmixed to
            stereo by the session with an explicit pan matrix.
        channelLayout:
          type: string
          nullable: true
          description: FFmpeg layout name (stereo, 5.1, 7.1, ...) when reported
        label:
          type: string
          nullable: true
          description: Optional title tag from the container (e.g. Commentary)
        default:
          type: boolean
          description: >
            Container default disposition. Exactly one track is default: the
            flagged one, else the first.
        streamIndex:
          type: integer
          minimum: 0
          description: Absolute ffprobe stream index

    SubtitleRender:
      type: string
      enum: [soft, burnIn]
      description: >
        soft = WebVTT delivery (ADR-0010 / ADR-0013). burnIn = pixels burned
        into the video encode when selected via subtitleTrackId (ADR-0018).

    SubtitleTrack:
      type: object
      required: [trackId, source, codec, forced, sdh, render]
      properties:
        trackId:
          type: string
          description: >
            Stable id used in the VTT URL or burn-in selection. Embedded
            `e{N}`; sidecar `s` / `s-{suffix}` from the filename (ADR-0010).
        source:
          type: string
          enum: [embedded, sidecar]
        codec:
          type: string
          description: Source codec or sidecar format (subrip, srt, vtt, ass, ...)
        language:
          type: string
          nullable: true
          description: Normalised ISO 639-1 when known; null if unlabelled
        label:
          type: string
          nullable: true
          description: Optional title tag from the container (embedded)
        forced:
          type: boolean
          description: Forced-subtitle flag (selection differs from full dialogue)
        sdh:
          type: boolean
          description: SDH / hearing-impaired flag from the sidecar name
        streamIndex:
          type: integer
          minimum: 0
          nullable: true
          description: Absolute ffprobe stream index when source is embedded
        render:
          $ref: "#/components/schemas/SubtitleRender"
        readiness:
          $ref: "#/components/schemas/SubtitleTrackReadiness"
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >
            Monotonic growth counter for this track's WebVTT body. Bumps when
            the server writes more cues (partial) or the final file. Clients
            that reload on growth compare this field; they do not infer growth
            from content length. Absent for burnIn tracks.
        url:
          type: string
          nullable: true
          description: >
            GET path for the WebVTT body when this track is soft and served
            (partial or complete). Absent while preparing, and for burnIn
            tracks (ADR-0018).

    EncoderStatus:
      type: string
      enum: [verified, failed, unavailable]
      description: >
        verified = short encode+demux succeeded; failed = advertised but
        verify failed; unavailable = not in this ffmpeg build.

    EncoderCandidate:
      type: object
      required: [name, backend, status]
      properties:
        name:
          type: string
          description: FFmpeg encoder name (e.g. libx264, h264_videotoolbox)
        backend:
          type: string
          description: Backend family (software, videotoolbox, nvenc, qsv, vaapi, ...)
        status:
          $ref: "#/components/schemas/EncoderStatus"
        reason:
          type: string
          nullable: true
          description: Required when status is not verified; null when verified

    TranscodeCapabilities:
      type: object
      required: [preferredH264Encoder, encoders]
      properties:
        ffmpegVersion:
          type: string
          nullable: true
        preferredH264Encoder:
          type: string
          description: >
            Encoder name from the preferred session-shaped encode leg
            (ADR-0009). Sessions use the full leg, not the name alone.
        preferredDevice:
          type: string
          nullable: true
          description: >
            Device path recorded when the preferred leg binds one
            (e.g. /dev/dri/renderD128 for VAAPI). Null for software, QSV
            sysmem, and VideoToolbox.
        encoders:
          type: array
          items:
            $ref: "#/components/schemas/EncoderCandidate"
