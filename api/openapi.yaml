openapi: 3.1.0
info:
  title: Nightjar API
  version: 0.2.0
  description: |
    Public API contract. Server handlers and the web client are built against
    this file. v0: libraries, items, playback info, direct-play and remux
    streams (ADR-0006).
  license:
    name: GPL-3.0-only
servers:
  - url: http://localhost:8096
    description: Local default
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v0/libraries:
    get:
      operationId: listLibraries
      summary: List all libraries
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
    post:
      operationId: createLibrary
      summary: Create a library pointing at a local folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}:
    get:
      operationId: getLibrary
      summary: Get one library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/scan:
    post:
      operationId: scanLibrary
      summary: Start an async library scan job (ADR-0004)
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "202":
          description: Scan job accepted (or existing active job returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobAccepted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/scan-jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Poll scan job state and counts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Scan job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/items:
    get:
      operationId: listLibraryItems
      summary: List media items in a library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}:
    get:
      operationId: getItem
      summary: Get one media item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/playback-info:
    get:
      operationId: getPlaybackInfo
      summary: Playback method, remux state, and stream URL for an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Playback info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/remux:
    post:
      operationId: startRemux
      summary: Start (or reuse) a background remux for an item
      description: >
        Async job per ADR-0006. Returns the current state immediately; poll
        playback-info until remuxState is ready. When all remux slots are busy
        the state stays notStarted with a reason; clients re-POST on each poll
        tick while they see notStarted.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "202":
          description: Remux state after this request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemuxAccepted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Item does not use the remux method
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/stream:
    get:
      operationId: streamItem
      summary: Byte stream for playback (supports HTTP Range)
      description: >
        Serves the original file for directPlay items and the remuxed MP4 for
        remux items once remuxState is ready.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Entire file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Remux not ready; POST remux and poll playback-info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Item needs transcoding, which is not available yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          description: Range not satisfiable

components:
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        core:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LibraryKind:
      type: string
      enum: [movies, shows]

    MediaKind:
      type: string
      enum: [movie, episode, unknown]

    ProbeStatus:
      type: string
      enum: [indexed, probed, error]
      description: >
        indexed = walk+filename done, codecs pending; probed = ffprobe ok;
        error = ffprobe failed (see scanError).

    ScanJobState:
      type: string
      enum: [queued, indexing, probing, completed, failed]

    PlaybackMethod:
      type: string
      enum: [directPlay, remux, transcode]
      description: >
        directPlay = browser plays the original file; remux = same codecs
        repackaged to MP4 by a background job; transcode = needs re-encoding,
        not available yet. Pending or failed probes report transcode.

    RemuxState:
      type: string
      enum: [notStarted, preparing, ready, failed]
      description: >
        Only meaningful when playbackMethod is remux. notStarted may carry a
        busy reason when all remux slots are in use; clients re-POST while
        they see it (ADR-0006).

    RemuxAccepted:
      type: object
      required: [itemId, remuxState]
      properties:
        itemId:
          type: integer
          format: int64
        remuxState:
          $ref: "#/components/schemas/RemuxState"
        reason:
          type: string
          description: Why the job is not running yet, or why it failed

    Library:
      type: object
      required: [id, name, path, kind, itemCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        itemCount:
          type: integer
          format: int64

    CreateLibraryRequest:
      type: object
      required: [name, path, kind]
      properties:
        name:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/LibraryKind"

    MediaItem:
      type: object
      required: [id, libraryId, path, title, kind, sizeBytes, probeStatus, playbackMethod]
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        path:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/MediaKind"
        year:
          type: integer
          nullable: true
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        sizeBytes:
          type: integer
          format: int64
        probeStatus:
          $ref: "#/components/schemas/ProbeStatus"
        scanError:
          type: string
          nullable: true
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"

    ScanJobAccepted:
      type: object
      required: [jobId, libraryId]
      properties:
        jobId:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64

    ScanJob:
      type: object
      required:
        - id
        - libraryId
        - state
        - added
        - updated
        - removed
        - unchanged
        - probed
        - errors
        - startedAt
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ScanJobState"
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
        probed:
          type: integer
        errors:
          type: integer
        indexDurationMs:
          type: integer
          format: int64
          nullable: true
          description: Wall time of the index pass; Gate 1 measures this.
        probeDurationMs:
          type: integer
          format: int64
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    PlaybackInfo:
      type: object
      required: [itemId, playbackMethod, reason, mimeType]
      properties:
        itemId:
          type: integer
          format: int64
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"
        remuxState:
          $ref: "#/components/schemas/RemuxState"
          description: Present when playbackMethod is remux
        remuxError:
          type: string
          description: Present when remuxState is failed or start is blocked
        reason:
          type: string
          description: Why the decision engine chose this method
        streamUrl:
          type: string
          description: >
            Present only when the item is playable now: directPlay, or remux
            with remuxState ready.
        mimeType:
          type: string
          description: video/mp4 for remux regardless of the source container
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true