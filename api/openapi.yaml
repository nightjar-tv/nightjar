openapi: 3.1.0
info:
  title: Nightjar API
  version: 0.2.0
  description: |
    Public API contract. Server handlers and the web client are built against
    this file. v0: libraries, items, playback info, direct-play streams, and
    HLS playback sessions (ADR-0011).
  license:
    name: GPL-3.0-only
servers:
  - url: http://localhost:8096
    description: Local default
# ADR-0034 item 11. Every operation needs a bearer token unless it says
# otherwise, and only four say otherwise. The default is stated here rather
# than repeated 41 times, so a new operation is authenticated by inheriting it.
security:
  - bearerAuth: []

paths:
  /api/health:
    get:
      security: []
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v0/libraries:
    get:
      operationId: listLibraries
      summary: List all libraries
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
    post:
      operationId: createLibrary
      summary: Create a library and enqueue its first scan (ADR-0015)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: >
            Library created and scan job accepted. The walk runs asynchronously
            (ADR-0004); poll GET /scan-jobs/{jobId} for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateLibraryResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}:
    get:
      operationId: getLibrary
      summary: Get one library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: patchLibrary
      summary: Update library name and/or repoint library root (ADR-0030)
      description: >
        Name-only updates return 200 with the library. A path change accepts an
        async repoint job (202) that dry-runs a full walk against a 0.90 retain
        guard before committing `libraries.path` and enqueueing a normal scan.
        Refusal reasons appear on the job error
        (`repoint_empty_match` | `repoint_below_retain_threshold`). No force
        override in v1. Path PATCH work is scan-class duration (two walks).
        Phase 1–2: unauthenticated (ADR-0003). Phase 3: admin-only — this
        mutates the library root and must not stay public after accounts land
        (ADR-0030).
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchLibraryRequest"
      responses:
        "200":
          description: Name-only update applied (no path change)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "202":
          description: Path repoint job accepted; poll GET /scan-jobs/{jobId}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobAccepted"
        "400":
          description: Invalid request or active job already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/scan:
    post:
      operationId: scanLibrary
      summary: Start an async library scan job (ADR-0004)
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "202":
          description: Scan job accepted (or existing active job returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobAccepted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/scan-jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Poll scan job state and counts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Scan job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/items:
    get:
      operationId: listLibraryItems
      summary: List media items in a library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/units:
    get:
      operationId: listLibraryUnits
      summary: List the browse units of a library (ADR-0039 item 4)
      description: >
        A browse unit is one series for a shows library and one item for a
        movies library, keyed by `series_key` in both cases (ADR-0039 item 2).
        The response says which kind of unit it carries, so a client does not
        have to know what it asked for. Units cover every media row in the
        library: `counts.items` equals the library's `itemCount`.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryUnits"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/scan-progress:
    get:
      operationId: getScanProgress
      summary: Progress of the library's most recent scan job (ADR-0004)
      description: >
        Named progress fields rather than a status histogram. Probe and
        metadata are reported separately because they finish at different
        times; nothing here combines them into one figure.
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanProgress"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/series:
    get:
      operationId: getSeries
      summary: One unit with its media rows in canonical order (ADR-0035 item 8)
      description: >
        A show returns its episodes grouped by canonical season. A movie key
        resolves too, because a movie is a series of one (ADR-0039 item 2) and
        its files are otherwise unreachable past the listing's single merged
        unit; `kind` says which was returned.


        `seriesKey` is a query parameter, not a path segment, for the reason
        ADR-0035 item 6 gives for `itemKey`: an unbound folder's key is
        `folder:{libraryId}:{relpath}` and contains slashes and spaces, which a
        path segment cannot carry through a proxy intact.
      parameters:
        - name: seriesKey
          in: query
          required: true
          description: >
            Opaque series_key from a LibraryUnit (ADR-0039 item 2). Pass back
            the string exactly as received; the grammar is not a parse
            contract and the server may change it in any version.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "400":
          description: Missing or malformed seriesKey
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No series under that key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}:
    get:
      operationId: getItem
      summary: Get one media item with its canonical metadata (ADR-0029 §1.2)
      description: >
        File facts and canonical metadata in one response rather than two
        endpoints: the detail surface renders both on one screen, and the
        ADR-0029 link table makes it one join. A client must not call this per
        tile while browsing; the units listing already carries what a grid
        needs.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/candidates:
    get:
      operationId: searchMetadataCandidates
      summary: Search TMDB candidates for manual metadata fix (ADR-0028)
      description: >
        Pre-accounts local-trust. Block 2 accounts work must make this
        admin-only first — assign rewrites watch state across profiles.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Override search title (default cleaned filename title)
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Candidate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataCandidatesResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/assign:
    post:
      operationId: assignMetadata
      summary: Assign a TMDB id (manual match, ADR-0028)
      description: >
        Ignores the 0.80 auto-match floor. Runs the ADR-0025 item_key migrator.
        Pre-accounts local-trust; must become admin-only with accounts.
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataAssignRequest"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataAssignResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/clear:
    post:
      operationId: clearMetadataMatch
      summary: Clear provider match; return to path item_key (ADR-0028)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataClearResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/metadata/retry:
    post:
      operationId: retryMetadataMatch
      summary: Bust negative-result cache and re-queue automatic match (ADR-0028)
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Queued pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataRetryResponse"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/artwork/{itemKey}/{kind}:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getArtwork
      summary: Serve cached artwork for an item_key (ADR-0027)
      parameters:
        - name: itemKey
          in: path
          required: true
          schema:
            type: string
          description: Opaque item_key (e.g. tmdb:movie:550)
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [poster, backdrop, banner, logo, still]
        - name: w
          in: query
          required: false
          schema:
            type: integer
            enum: [342, 780]
          description: Derived width; omitted serves original when present
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/playback-info:
    get:
      operationId: getPlaybackInfo
      summary: Playback method and delivery URL for an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MaxBitrateBps"
        - $ref: "#/components/parameters/MaxHeight"
        - $ref: "#/components/parameters/ProfileHdr"
      responses:
        "200":
          description: Playback info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/subtitles/{trackId}.vtt:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSubtitleVtt
      summary: WebVTT for one text subtitle track (ADR-0010)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: trackId
          in: path
          required: true
          description: >
            Stable track id (ADR-0010): `e{streamIndex}` for embedded,
            `s` / `s-{suffix}` for filesystem sidecars.
          schema:
            type: string
            pattern: '^[es]([A-Za-z0-9._-]*)$'
      responses:
        "200":
          description: WebVTT body
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: Item or serveable subtitle track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/stream:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: streamItem
      summary: Byte stream for playback (supports HTTP Range)
      description: >
        Serves the original file for directPlay items. Remux and transcode
        items are delivered as HLS sessions (ADR-0011). Honours profileId
        (ADR-0022); default BROWSER_V0 keeps today's 415 on Matroska for
        anonymous browser callers.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MaxBitrateBps"
        - $ref: "#/components/parameters/MaxHeight"
        - $ref: "#/components/parameters/ProfileHdr"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Entire file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Item needs an HLS session; POST /api/v0/items/{itemId}/sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          description: Range not satisfiable

  /api/v0/items/{itemId}/sessions:
    post:
      operationId: startTranscodeSession
      summary: Start an HLS playback session for an item
      description: >
        ADR-0011 / ADR-0020. Returns 202 with sessionId and playlistUrl
        (the session master, /sessions/{sessionId}/master.m3u8). Remux items get
        a stream-copy session, transcode items a re-encoding one; the shape is
        identical. Far seek uses POST /sessions/{sessionId}/seek?startMs=, which
        returns the same playlistUrl (ADR-0054 decision 5). Admission is
        measured, not configured (ADR-0050 sections 7 and 8): a session is
        admitted unless the box has too little memory to hold another encoder.
        There is no default concurrency limit. NIGHTJAR_HLS_MAX_ENCODERS
        remains available as an operator override.
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: startMs
          in: query
          required: false
          description: Encode window start in milliseconds (default 0)
          schema:
            type: integer
            format: int64
            minimum: 0
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/MaxBitrateBps"
        - $ref: "#/components/parameters/MaxHeight"
        - $ref: "#/components/parameters/ProfileHdr"
        - name: audioTrackId
          in: query
          required: false
          description: >
            Audio track to map, from playbackInfo.audioTracks (ADR-0012).
            Defaults to the flagged default track, else the first. Switching
            audio starts a new session at the current position and DELETEs the
            old one. On an otherwise DirectPlay title, an over-ceiling track
            starts a hybrid session (ADR-0012 / ADR-0018).
          schema:
            type: string
            pattern: '^e[0-9]+$'
        - name: subtitleTrackId
          in: query
          required: false
          description: >
            Burn-in subtitle track from playbackInfo.subtitleTracks with
            render=burnIn (ADR-0018). Soft (WebVTT) tracks are selected via
            MEDIA / track elements, not this param. Switching burn-in starts
            a new session at the current position and DELETEs the old one.
            Selecting burn-in on a DirectPlay title starts a transcode
            session.
          schema:
            type: string
        - name: replacesSessionId
          in: query
          required: false
          description: >
            Explicit predecessor for a replacement start (ADR-0034 item 8).
            Must name a live session of the authenticated account and profile
            on the same item. A successor that starts through it takes over
            the predecessor's account slot and retires the predecessor's
            playback authority server-side; the client does not need to DELETE
            it. Without this parameter a start at the account ceiling is
            refused, because same identity is not proof that two devices are
            one playback. At most one replacement per predecessor is pending
            at a time.
          schema:
            type: string
      responses:
        "202":
          description: Session started for this item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: >
            Item not found, or `replacesSessionId` names no playable session of
            this account and profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            `replacesSessionId` already has an in-flight replacement. One
            successor per predecessor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: >
            Item direct plays without a track selection that requires encode,
            or is not ready for a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            `replacesSessionId` names a session on a different item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Admission refused: no capacity for another encoder (ADR-0050), or
            the authenticated account is at its `maxConcurrentSessions` ceiling
            (ADR-0034 item 8). The body's `code` tells them apart:
            `admission_refused` is retryable; `account_ceiling_refused` is not
            retryable until a session ends or the account limit moves. A client
            branches on `code`, not on the sentence in `error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/master.m3u8:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionMasterPlaylist
      summary: HLS master playlist for a session
      description: >
        ADR-0020, ADR-0054 decision 5. Declares the single video rendition
        (index.m3u8) and optional SUBTITLES group. playlistUrl from session
        start and seek both point here, and it is the same URI for the life of
        the session. Far seek is POST /seek, not a startMs query on this URI.
        After a seek the client re-attaches to this URI; the run it is playing
        appears only in the media playlist's EXT-X-MAP.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: HLS master playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Playlist not ready yet (no mapped segments)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/index.m3u8:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionPlaylist
      summary: HLS media playlist for a session
      description: >
        Assembled from the session-global time-keyed segment map (ADR-0020),
        listing the whole title on the grid the encode leg will produce
        (ADR-0054 decisions 1 and 2). Segment URIs are path-absolute under
        /api/v0/sessions/{sessionId}/. PLAYLIST-TYPE is VOD with ENDLIST in
        every mode; EXT-X-START carries the land, title-absolute.

        EXT-X-MAP names the current run's init and is the one field that
        changes between two fetches of this URI: the init carries the land in
        its elst empty edit, so runs at different lands cannot share one
        (ADR-0054 decision 4, overturned 2026-08-31). Clients read it on
        attach, alongside the playlist that names it.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Playlist not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/v/{rung}/index.m3u8:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionRungPlaylist
      summary: HLS media playlist for a named video rung
      description: >
        ADR-0051 amendment 1. Today only the single rendition exists, so its
        bytes and response semantics are identical to the session-scoped
        index.m3u8 route. Unknown rung names return 404 rather than selecting
        that rendition implicitly.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/VideoRung"
      responses:
        "200":
          description: HLS media playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session or rung not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Playlist not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/v/{rung}/{asset}:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionRungAsset
      summary: HLS media segment for a named video rung
      description: >
        ADR-0051 amendment 1. The rung namespace contains time-keyed media
        segments only; init.mp4 remains outside it. Axum cannot express the
        mixed static and parameter segment name, so the handler validates the
        asset against the pattern below. Unknown rung names return 404.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/VideoRung"
        - name: asset
          in: path
          required: true
          description: A time-keyed media segment name (ADR-0020).
          schema:
            type: string
            pattern: '^seg_[0-9]{11}\.m4s$'
        - name: njFetcher
          in: query
          required: false
          description: >
            Log-only client marker, with the same semantics as the top-level
            session asset route.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: Segment bytes
          content:
            video/iso.segment:
              schema:
                type: string
                format: binary
        "204":
          description: >
            Abandoned or superseded segment GET held with no fill until the
            session idle ceiling while the session lived; empty body
            (ADR-0011).
        "404":
          description: Session, rung, or asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Segment not on disk yet; retryable while encoding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/runs/{runId}/init.mp4:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionRunInit
      summary: fMP4 init segment for a producer run
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Init segment bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Session or run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Init not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/subs/{asset}:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionSubtitlePlaylist
      summary: Subtitle media playlist or WebVTT segment for a session track
      description: >
        ADR-0010 / ADR-0013. EXT-X-MEDIA URI target. Ready tracks use a
        multi-segment `{trackId}.m3u8` whose `segNNN.vtt` bodies are sliced
        from the item store VTT (no session demux). Cold session-inline
        demux remains for fixtures only; Gate-1 snapshots only declare
        complete/store tracks.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: asset
          in: path
          required: true
          description: >
            `{trackId}.m3u8` or `{trackId}/segNNN.vtt` (e.g. e2.m3u8,
            e2/seg000.vtt, s-en/seg012.vtt)
          schema:
            type: string
            pattern: '^[es][A-Za-z0-9._-]*(?:\.m3u8|/seg[0-9]+\.vtt)$'
      responses:
        "200":
          description: HLS subtitle media playlist or WebVTT segment
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
        "404":
          description: Session or track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Subtitle segment not ready yet (demux still catching up)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/init.mp4:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionInit
      summary: fMP4 init segment for a session
      description: >
        The playlist points at the run-scoped `runs/{runId}/init.mp4`, so this
        is the shape a client holding an older URI asks for. It is a path of
        its own rather than one value of the asset capture below because that
        capture is cookie-accepted and the router cannot otherwise say which
        names it covers (issue #96). Unlike the playlists, the init stayed
        run-scoped under ADR-0054 decision 5: it carries the land.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Init segment bytes
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Session or init segment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Init not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/{asset}:
    get:
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      operationId: getSessionAsset
      summary: HLS media segment for a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: asset
          in: path
          required: true
          description: >
            A time-keyed media segment name (ADR-0020). The server serves this
            and `init.mp4` above and nothing else; the pattern is the contract
            the router cannot express, since axum will not route a segment that
            mixes static text with a parameter.
          schema:
            type: string
            pattern: '^seg_[0-9]{11}\.m4s$'
        - name: njFetcher
          in: query
          required: false
          description: >
            Log-only client marker. Serving ignores this. Attach-wait probes
            may set it (`attach-wait`); Safari's native HLS engine does not.
            Distinguishes probe traffic from WebKit segment GETs in dogfood
            logs without changing 200/503/204 behaviour. Far scrub is
            POST /seek (ADR-0020) — clients must not poke segment URIs to
            force cooking.
          schema:
            type: string
            maxLength: 32
      responses:
        "200":
          description: Segment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "204":
          description: >
            Abandoned or superseded segment GET held with no fill until the
            session idle ceiling while the session lived; empty body
            (ADR-0011). Not an application error. Distinct from DELETE
            session 204.
        "404":
          description: Session or asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Segment not on disk yet (encoder still cooking). Retryable; do not
            treat as a permanent miss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/seek:
    post:
      operationId: seekTranscodeSession
      summary: Far scrub — new producer run behind one playlist URI
      description: >
        ADR-0020. Applies startMs and starts a new run when needed. playlistUrl
        is unchanged, because it is the session's (ADR-0054 decision 5).

        Clients must still re-attach the player source to it (hls.js
        loadSource / Safari native, which needs an explicit load() since the
        string does not change). The re-attach is what picks up the new run's
        EXT-X-MAP; without it the client keeps the init it first saw. Track
        selections do not survive the swap; re-apply after attach.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: startMs
          in: query
          required: true
          description: Title-absolute play land in milliseconds
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "202":
          description: Seek applied (or already at this land)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}:
    get:
      operationId: getTranscodeSession
      summary: Current session snapshot
      description: >
        playlistUrl, landedMs, and usableExtentMs when known (ADR-0020).
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteTranscodeSession
      summary: Stop a playback session and reap its FFmpeg process
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Stopped (or already gone)
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/system/setup:
    get:
      security: []
      operationId: getSetupState
      summary: Whether an admin and a library exist (ADR-0034 item 11)
      description: >
        Unauthenticated, the same class as /system/transcode.


        **Two independent facts, never one flag.** A `setupComplete` boolean
        cannot express the third state, and the third state is the only install
        we actually have: the dogfood database holds libraries and roughly
        24,800 items and no account. A wizard trusting one flag reads that as
        fresh and offers to add a library the server already holds. No derived
        `setupComplete`, `nextStep` or `state` field is added later either;
        they are the same collapse in different costumes, and the moment one
        exists clients reach for it instead of the two facts.
      responses:
        "200":
          description: Setup state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupState"

  /api/v0/auth/bootstrap:
    post:
      security: []
      operationId: bootstrapFirstAccount
      summary: Create the first account on a server that has none (ADR-0034 item 10)
      description: >
        The one unauthenticated write in the server, gated on exactly one
        condition: that no account exists. No token, no environment variable,
        no setup code printed to the log, because core behaviour works by
        default (Rule 4.12) and a printed code is unreadable in half the ways
        this server is deployed.


        The account is created with role `owner`, and one uncapped profile with
        simple interface off is created in the same transaction, because an
        account with no profile has nowhere to write watch state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: First account created; the token is returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "409":
          description: >
            An account already exists. Named `bootstrap_already_complete`, not
            a generic 403, so a client can tell "you are too late" from "you
            are not allowed".
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/auth/login:
    post:
      security: []
      operationId: login
      summary: Exchange credentials for a session token (ADR-0034 item 5)
      description: >
        Returns the token in the body **exactly once**; the server stores only
        its SHA-256 and cannot return it again. Also sets an `HttpOnly`,
        `SameSite=Lax` cookie holding the same token, scoped to `/api/v0` and
        marked `Secure` when the request arrived over TLS. One credential in
        two envelopes: expiry, revocation and sign-out-everywhere kill both at
        once.


        A wrong password and an unknown username are the same response and take
        the same time. The server verifies against a dummy Argon2id hash when
        the account does not exist, so the memory-hard cost is paid either way
        and the route is not a user-enumeration oracle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Credentials rejected. Indistinguishable for unknown user and wrong password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/auth/session:
    get:
      operationId: getSession
      summary: The current session's account, role and active profile
      description: >
        Which profile this session is acting **as**. Not to be confused with
        `/api/v0/profiles/{profileRef}/...`, which is which profile a request
        acts **on** and is a different question with a near-identical shape.
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
        "401":
          description: Unknown, expired or revoked. Three distinct named errors, not one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: selectProfile
      summary: Narrow this session to a profile (ADR-0034 item 3)
      description: >
        Narrowing is free and takes only a `profileRef`. **Widening back is
        not**, and the asymmetry is the security property rather than an
        inconsistency: without it a child on a narrowed session leaves the
        classification cap by tapping a menu, which defeats B2-D before it
        ships. See DELETE on this path.


        This sets which profile the session acts **as**. A session in profile
        scope cannot administer the server, including the account holder's own
        profile and including an adult-flagged one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profileRef]
              properties:
                profileRef:
                  type: string
                  description: >
                    Opaque durable reference (ADR-0034 item 6). Never
                    `profileId`: that name is taken by ADR-0022's client
                    capability profile.
      responses:
        "204":
          description: Session narrowed
        "403":
          description: That profile is not on this session's account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: widenToAccountScope
      summary: Widen this session back to account scope, with the password
      description: >
        Takes the account password, deliberately. Narrowing is free because it
        only ever reduces reach; widening restores it, and a re-authentication
        is what stops a capped viewer escaping the cap by navigating. B2-7 is
        expected to add a PIN as an equal-strength shortcut here; this route
        does not bind that design.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          description: Session widened to account scope
        "401":
          description: Password rejected; the session stays narrowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/auth/logout:
    post:
      operationId: logout
      summary: Revoke this session
      description: >
        Sets `revoked_at` rather than deleting the row, so a later presentation
        of the token reads as revoked rather than unknown. Kills the cookie and
        the bearer token together; they are one credential.
      responses:
        "204":
          description: Session revoked

  /api/v0/auth/logout-all:
    post:
      operationId: logoutEverywhere
      summary: Revoke every session on this account
      responses:
        "204":
          description: All sessions on the account revoked

  /api/v0/accounts:
    get:
      operationId: listAccounts
      summary: Accounts on this server (owner and manager only)
      description: >
        A member reaches their own account and no others (ADR-0040 item 1), and
        gets the named forbidden error rather than a 404: a 404 would leak
        whether an account exists.
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "403":
          description: Named forbidden error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createAccount
      summary: Create an account (owner and manager)
      description: >
        Creates one uncapped profile with simple interface off in the same
        transaction (ADR-0034 item 3): an account with no profile has nowhere
        to write watch state. Those two values are a creation default, not a
        semantics decision; what a cap means is B2-D's.


        `role` may be `manager` or `member`. It may not be `owner`: there is
        exactly one owner and the only way to become it is transfer, which is
        an owner-only action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          description: Named forbidden error, including an attempt to create a second owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/accounts/{accountId}:
    delete:
      operationId: deleteAccount
      summary: Delete an account
      description: >
        Deletes its profiles and revokes its sessions (ADR-0034 item 7).


        **Owner-only when the target is a `manager`** (ADR-0040 item 3), which
        is the eviction case the role model exists for: under a boolean, anyone
        who could administer the server could remove the person who installed
        it. The owner cannot be deleted at all; its role changes only through
        transfer.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Account deleted
        "403":
          description: >
            Named forbidden error: a manager deleting a manager, anyone
            deleting the owner, or a member deleting anyone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/accounts/{accountId}/role:
    put:
      operationId: setAccountRole
      summary: Change an account's role (owner only, ADR-0040 item 3)
      description: >
        One of the three owner-only actions. Setting `owner` transfers
        ownership: the acting owner is demoted to `manager` and the target
        promoted **in one transaction**, so the partial unique index enforcing
        one owner is never transiently violated and the server is never
        ownerless. The target must be an existing account; there is no unowned
        state.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
                confirmDemotesCaller:
                  type: boolean
                  description: >
                    Required to be `true` when `role` is `owner`, and ignored
                    otherwise. Transfer is the most consequential action on the
                    server and it is otherwise indistinguishable from any other
                    role change: one body value apart.


                    This is not a second writer to the column, which would be
                    the fork Rule 4.11 refuses. It is the same writer declining
                    an ambiguous request, and it makes the call legible in the
                    schema: a reader meets the field name and understands what
                    the request does. Same instinct as ADR-0034 item 10's named
                    `bootstrap_already_complete` rather than a generic 403.
      responses:
        "204":
          description: Role changed, or ownership transferred
        "400":
          description: >
            `role` is `owner` and `confirmDemotesCaller` was absent or false.
            Named, not generic: the caller is being told what the request would
            have done, not that it was malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Named forbidden error; a manager cannot change any role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/accounts/{accountId}/playback-policy:
    patch:
      operationId: updateAccountPlaybackPolicy
      summary: Set an account's playback-policy ceilings (owner and manager)
      description: >
        Full replacement of the three account ceilings (ADR-0034 item 8,
        ADR-0022 §5 as amended 2026-09-12): `maxConcurrentSessions`,
        `maxBitrateBps` and `maxHeight`. Null or omitted means no account
        ceiling, which is the shipped default for all three; `{}` clears all
        three. Zero, negative or out-of-range values are refused with the typed
        422, and an unknown body field is refused rather than ignored.
        `maxBitrateBps` and `maxHeight` are advisory until trusted-proxy work
        lands: surfaced on the account and on `playbackInfo`, not
        byte-enforced. `maxConcurrentSessions` is enforced at playback session
        creation. Owner or manager in account scope may set any account; a
        member and every profile-scope session are refused before the target is
        looked up, so an unknown target is the typed 404.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackPolicyRequest"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          description: >
            Named forbidden error: a member, or any profile-scope session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such account, after authority was settled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            A ceiling is zero, negative or out of range, or the body carries an
            unknown field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/profiles:
    get:
      operationId: listProfiles
      summary: Profiles this session may see
      description: >
        A member sees the profiles under their own account. An owner or manager
        sees any account's when `accountId` is given, and their own otherwise
        (ADR-0040 item 1).


        A member passing another account's `accountId` gets a named 403, **not
        an empty list**. An empty list is indistinguishable from "that account
        exists and has no profiles", which is an account-enumeration oracle of
        the same family as a login route that answers faster for an unknown
        username. For the same reason the refusal does not depend on whether
        the account exists: a member passing any id but their own is refused
        identically, so the response cannot be used to probe.
      parameters:
        - name: accountId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: object
                required: [profiles]
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "403":
          description: >
            A member asked about an account other than their own. Named, and
            returned whether or not that account exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createProfile
      summary: Create a profile under an account
      description: >
        A member may create profiles under their own account and no other. That
        is the point of the role: a member holding a child's profile is a
        parent, and a parent who cannot set their own child's cap has no reason
        to hold an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /api/v0/profiles/{profileRef}:
    delete:
      operationId: deleteProfile
      summary: Delete a profile
      description: >
        `profileRef` here is which profile the request acts **on**, which is a
        different question from `/api/v0/auth/session`'s "acting as". The two
        route families look alike and a reader will conflate them if neither
        says so.


        Destroys the profile's watch state and its name. Playback event rows
        stay, with a reference that no longer resolves (ADR-0034 item 7). Every
        session narrowed to this profile is destroyed with it, so a token for
        one reads as unknown rather than revoked.
      parameters:
        - name: profileRef
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Profile deleted
        "403":
          description: Named forbidden error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProfile
      summary: Update a profile's track-selection preferences
      description: >
        ADR-0038 amendment §2. A full replacement of the two preference fields.
        Authority is ADR-0035 item 7: a profile session reaches its active
        profile, and from account scope an owner or manager reaches any profile
        while a member reaches its own account's. A ref the caller may not
        address and one that does not exist get the same named 403.
      parameters:
        - name: profileRef
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "403":
          description: Named forbidden error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            A language that is not a lowercase two-letter code or null, or a
            subtitle default that is neither `auto` nor `off`. The code is
            `validation_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/profiles/{profileRef}/track-choice:
    put:
      operationId: putTrackChoice
      summary: Replace a profile's track choice for one series
      description: >
        ADR-0038 item 7 and its 2026-09-12 amendment. The body is a full
        replacement: `{audio: TrackDescription|null, subtitle: SubtitleChoice}`,
        and unknown fields are refused with the typed 422. `seriesKey` is an
        opaque query parameter rather than a path segment because a
        `folder:`-keyed series key contains slashes (ADR-0035 item 6), and it
        must resolve through the effective series identity layer or the write
        is a typed 404.


        Only the profile-scope session for that exact profile may write. Every
        account-scope token and every other profile gets the existing
        non-leaking forbidden response.
      parameters:
        - name: profileRef
          in: path
          required: true
          schema:
            type: string
        - name: seriesKey
          in: query
          required: true
          description: >
            Opaque series key (ADR-0039 item 2). Pass it back exactly as
            received, percent-encoded like any query value.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackChoiceRequest"
      responses:
        "200":
          description: The stored choice, with server time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackChoiceEnvelope"
        "400":
          description: The seriesKey query is missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The caller is not this profile's own profile-scope session, or the
            ref does not exist. The two are one response so the ref cannot be
            probed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The seriesKey does not resolve to a series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The body is not exactly the required shape, carries an unknown
            field, or names an unknown kind or mode. The code is
            `validation_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/profiles/{profileRef}/watch-state:
    get:
      operationId: getWatchState
      summary: Read one profile's watch state for an item
      description: >
        ADR-0035 item 6 and its 2026-09-12 amendment. `profileRef` is the
        profile whose state is read, which is a different question from the
        session's own scope. A profile session reaches only its active profile;
        from account scope an owner or manager reaches any profile and a member
        reaches the profiles under its own account. A ref the caller may not
        address and a ref that does not exist get the same named 403, so the
        response cannot be used to probe for a profile.


        A key the server cannot resolve through its effective identity layer is
        a 404. A resolvable item with no stored state is a 200 with
        `state: null`, which is a different answer and is deliberately kept so.
      parameters:
        - name: profileRef
          in: path
          required: true
          schema:
            type: string
        - name: itemKey
          in: query
          required: true
          description: >
            Opaque item key (ADR-0025 §1). Pass it back exactly as received,
            percent-encoded like any query value.
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: The stored state, or null when the item has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchStateEnvelope"
        "400":
          description: >
            The itemKey query is missing or empty. The code is `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The caller may not address this profile, or it does not exist. The
            two are one response so the ref cannot be probed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The itemKey does not resolve to an item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: putWatchState
      summary: Report a profile's playback position for an item
      description: >
        The body is exactly `positionMs` and `durationMs`. `played` is derived
        from the 90% ceiling and is never accepted from a client; `hidden`
        belongs to the later rollup block and is not writable here; a client
        timestamp is refused with the typed 422 because the server clock stamps
        every write (ADR-0035 items 2 and 3 and the amendment).


        Below 2% of duration the write removes any existing state. At or above
        90% the item is played, and a later report below 90% clears `played`
        for a rewatch. Every qualifying write overwrites the row, so a reverse
        seek wins over an earlier higher position.
      parameters:
        - name: profileRef
          in: path
          required: true
          schema:
            type: string
        - name: itemKey
          in: query
          required: true
          description: Opaque item key (ADR-0025 §1), exactly as received.
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchReportRequest"
      responses:
        "200":
          description: >
            The stored state, or null when the report was below the resume
            floor and removed it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchStateEnvelope"
        "400":
          description: >
            The itemKey query is missing or empty, or the body is not valid
            JSON so the server could not read the request at all. The code is
            `bad_request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >
            The caller may not address this profile, or it does not exist. The
            two are one response so the ref cannot be probed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The itemKey does not resolve to an item, so no state is written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: >
            The request did not carry a JSON content type. The code is
            `unsupported_media_type`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >
            The body parsed but does not match the accepted shape — a
            prohibited or unknown field, a missing required field, or a field
            of the wrong type — or its values are not usable: a zero duration,
            a negative position, or a position past the duration. The code is
            `validation_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/system/transcode:
    get:
      operationId: getTranscodeCapabilities
      summary: Verified H.264 encode capabilities for this process
      description: >
        Startup detection-by-verification (ADR-0009). Each candidate is
        verified | failed | unavailable with a reason when not verified.
        preferredH264Encoder is the encoder name from the preferred encode leg
        (ADR-0009). optional preferredDevice is the render node when the leg
        binds one (e.g. VAAPI).
      responses:
        "200":
          description: Capability readout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeCapabilities"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The session token returned once by login or bootstrap. Never stored
        server-side in plaintext; only its SHA-256 is (ADR-0034 item 5).
    cookieAuth:
      type: apiKey
      in: cookie
      name: nj_session
      description: >-
        Accepted on exactly the eight GET routes ADR-0034 item 9 enumerates,
        because a media element cannot send an Authorization header. Every
        operation that accepts it lists it explicitly; nothing inherits it.
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    VideoRung:
      name: rung
      in: path
      required: true
      description: >
        Named video rendition. This grammar slice exposes only today's single
        rendition; later ADR-0051 slices add the measured ladder rungs.
      schema:
        type: string
        enum: [single]
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 0
    ProfileId:
      name: profileId
      in: query
      required: false
      description: >
        Client capability profile id (ADR-0022). Known ids: BROWSER_V0,
        MEDIA3_V0, MPV_V0, AETHER_V0. Omitted or unknown with no field bag
        falls back to BROWSER_V0. Optional maxBitrateBps / maxHeight / hdr
        override the named floor (unknown id + bag still decides).
      schema:
        type: string
        minLength: 1
    MaxBitrateBps:
      name: maxBitrateBps
      in: query
      required: false
      description: >
        Field-bag override (ADR-0022). Source video bitrate above this forces
        transcode at or under the ceiling. null / omitted leaves the named
        profile value.
      schema:
        type: integer
        format: int64
        minimum: 1
    MaxHeight:
      name: maxHeight
      in: query
      required: false
      description: >
        Field-bag override (ADR-0022). Source height above this forces
        transcode with scale. null / omitted leaves the named profile value.
      schema:
        type: integer
        minimum: 1
    ProfileHdr:
      name: hdr
      in: query
      required: false
      description: Field-bag override for highest accepted HDR (ADR-0022).
      schema:
        $ref: "#/components/schemas/HdrCapability"

  schemas:
    HdrCapability:
      type: string
      enum: [none, hdr10, dolbyVision]
      description: >
        Highest HDR the client accepts (ADR-0022). Source above this forces
        transcode with a real tone-map graph (zscale + hable) when encoding.

    ClientCapabilityProfile:
      type: object
      description: >
        Wire shape for a reported profile (ADR-0022). Named ids cover the
        common engines; unknown id may send maxBitrateBps / maxHeight / hdr
        as query overrides (field bag). Codec lists on the bag are a later
        additive slice.
      properties:
        profileId:
          type: string
        maxBitrateBps:
          type: integer
          format: int64
          nullable: true
          description: Source video bitrate above this forces transcode. null = no ceiling.
        maxHeight:
          type: integer
          nullable: true
          description: Source height above this forces transcode. null = no ceiling.
        hdr:
          $ref: "#/components/schemas/HdrCapability"

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        core:
          type: string

    Error:
      type: object
      required: [error, code]
      description: >
        Every API error body carries `error`, the sentence for a person, and
        `code`, a stable machine-readable class the client can branch on.
        Match `code`, never the wording of `error`: the sentence is copy, not
        an API (Rule 4.11).
      properties:
        error:
          type: string
          description: Human sentence for a log or a raw response. Not an API.
        code:
          type: string
          description: >
            Stable machine-readable class of the error, independent of the
            wording of `error`. `admission_refused` on the session-create
            503 is the one a playback client branches on today.

    LibraryKind:
      type: string
      enum: [movies, shows]

    MediaKind:
      type: string
      enum: [movie, episode, unknown]

    ProbeStatus:
      type: string
      enum: [indexed, probed, error, unavailable]
      description: >
        indexed = walk+filename done, codecs pending; probed = ffprobe ok;
        error = permanent ffprobe/parse failure (see scanError);
        unavailable = mount/IO absence, retriable (ADR-0014).

    SubtitleStatus:
      type: string
      enum: [pending, ready, none, error, unavailable]
      description: >
        Item-level extract queue state (ADR-0013 / ADR-0014). pending =
        extract queued or in progress; ready = WebVTT on disk; none = no
        serveable text tracks; error = permanent extract failure; unavailable
        = mount/IO absence, retriable. Per-track first-play readiness is
        SubtitleTrack.readiness, not this field.

    SubtitleTrackReadiness:
      type: string
      enum: [preparing, partial, complete]
      description: >
        Server-declared per-track readiness for serveable text tracks
        (ADR-0013 §11). preparing = extract not yet writing cues; partial =
        a growing WebVTT is serveable; complete = final WebVTT. Clients never
        invent this from file size or a timer. Absent on burnIn tracks
        (ADR-0018).

    ScanJobState:
      type: string
      enum: [queued, indexing, probing, completed, failed]

    PlaybackMethod:
      type: string
      enum: [directPlay, remux, transcode]
      description: >
        directPlay = browser plays the original file; remux = same codecs in a
        container the client cannot open, delivered as a stream-copy HLS
        session; transcode = needs re-encoding, delivered as an encoding HLS
        session. Pending or failed probes report transcode.

    TranscodeSession:
      type: object
      required:
        [sessionId, itemId, playlistUrl, videoEncoder, encoderKind, landedMs, mediaOriginMs]
      properties:
        sessionId:
          type: string
        itemId:
          type: integer
          format: int64
        playlistUrl:
          type: string
          description: >
            Path to the session's HLS master playlist
            (/sessions/{id}/master.m3u8). One URI for the life of the session,
            unchanged by a far seek (ADR-0020, ADR-0054 decision 5).
        videoEncoder:
          type: string
          description: >
            FFmpeg encoder currently used by this session, or "copy" when the
            session stream-copies video (remux).
        encoderKind:
          type: string
          enum: [hardware, software, copy]
          description: >
            Whether videoEncoder is a hardware encoder, a software encoder, or
            a stream copy.
        landedMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Producer-observed land (first mapped segment start for the current
            run), title-absolute milliseconds. Where the producer started, not
            where the element's clock is zeroed — that is mediaOriginMs.
        mediaOriginMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            Title-absolute milliseconds that media time 0 means for the current
            playlist, so a client can convert element currentTime to a title
            position. A full-title listing (ADR-0054) zeroes at 0; the per-run
            listing it kept from ADR-0020 §4 zeroes at its first listed
            segment. Which shape a run serves is a runtime property that can
            change mid-session, so a client must read this rather than derive
            it from encoderKind, duration or seekable.
        usableExtentMs:
          type: integer
          format: int64
          minimum: 0
          description: >
            When a producer reaches EOF materially short of the container's
            claimed duration, the usable media end in milliseconds. Absent when
            unknown or undamaged.
        audioReason:
          type: string
          nullable: true
          description: >
            Why this session's audio track was selected (ADR-0038 item 5). The
            string the track menu shows. Absent on responses that do not select
            a track (get, seek).
        subtitleReason:
          type: string
          nullable: true
          description: >
            Why this session's subtitle track was selected, or why none was
            (ADR-0038 item 5). Absent on responses that do not select a track.

    Library:
      type: object
      required:
        - id
        - name
        - path
        - kind
        - itemCount
        - reachable
        - pathsUnresolved
        - skippedOutsideRoot
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        itemCount:
          type: integer
          format: int64
        reachable:
          type: boolean
          description: >
            False when the library root is not reachable (unmounted share,
            missing path). Work is paused until it returns (ADR-0014).
        pathsUnresolved:
          type: integer
          format: int64
          description: >
            Rows still stored as absolute paths after migration / pending
            repair under the current root (ADR-0030).
        skippedOutsideRoot:
          type: integer
          format: int64
          description: >
            Last index pass count of walked files outside the library root
            (symlink escape / bind overlap); visible, not log-only (ADR-0030).

    PatchLibraryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
          description: >
            Candidate library root for async repoint. Must be an existing
            directory. Same path as current (after normalize) is a no-op.

    CreateLibraryRequest:
      type: object
      required: [name, path, kind]
      properties:
        name:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/LibraryKind"

    CreateLibraryResponse:
      type: object
      required:
        - id
        - name
        - path
        - kind
        - itemCount
        - reachable
        - pathsUnresolved
        - skippedOutsideRoot
        - jobId
      description: >
        Library row plus the scan job enqueued on create (ADR-0015).
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        itemCount:
          type: integer
          format: int64
        reachable:
          type: boolean
        pathsUnresolved:
          type: integer
          format: int64
        skippedOutsideRoot:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
          description: Async scan job started for this library.

    MetadataCandidate:
      type: object
      required: [provider, kind, id, title, suggested]
      properties:
        provider:
          type: string
          enum: [tmdb]
        kind:
          type: string
          enum: [movie, tv]
        id:
          type: integer
          format: int64
        title:
          type: string
        year:
          type: integer
          nullable: true
        suggested:
          type: boolean
          description: >
            ADR-0048 B. At most one candidate in a response carries true: the
            entity the matcher's own scorer chose and the auto-match floor then
            declined. A rank for the client to lead with, never a binding —
            assign still takes the id the user picked. Movies only; a TV
            response has no suggestion, because the evidence the drain scores a
            show on is not available on this route.

    MetadataCandidatesResponse:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/MetadataCandidate"

    MetadataAssignRequest:
      type: object
      required: [kind, id]
      properties:
        provider:
          type: string
          enum: [tmdb]
          default: tmdb
        kind:
          type: string
          enum: [movie, tv]
        id:
          type: integer
          format: int64
          description: TMDB movie id or TV series id

    MetadataAssignResponse:
      type: object
      required: [itemKey, mediaItemId]
      properties:
        itemKey:
          type: string
        mediaItemId:
          type: integer
          format: int64

    MetadataClearResponse:
      type: object
      required: [itemKey, mediaItemId]
      properties:
        itemKey:
          type: string
        mediaItemId:
          type: integer
          format: int64

    MetadataRetryResponse:
      type: object
      required: [mediaItemId, status]
      properties:
        mediaItemId:
          type: integer
          format: int64
        status:
          type: string
          enum: [pending]

    MediaItem:
      type: object
      required: [id, libraryId, path, title, kind, sizeBytes, probeStatus, subtitleStatus, metadataStatus, playbackMethod]
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        path:
          type: string
          description: >
            Absolute filesystem path reconstructed at response time from the
            current library root and stored relpath (ADR-0030). Not stable
            across library repoint — use `id` for identity.
        title:
          type: string
        kind:
          $ref: "#/components/schemas/MediaKind"
        year:
          type: integer
          nullable: true
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        sizeBytes:
          type: integer
          format: int64
        probeStatus:
          $ref: "#/components/schemas/ProbeStatus"
        subtitleStatus:
          $ref: "#/components/schemas/SubtitleStatus"
        metadataStatus:
          $ref: "#/components/schemas/MetadataStatus"
        scanError:
          type: string
          nullable: true
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"

    ArtworkKind:
      type: string
      enum: [poster, backdrop, logo]
      description: >
        Kinds an item surface renders (ADR-0027 §1). poster is the grid tile,
        backdrop the detail background, logo the title treatment over it. The
        store also holds banner and still; those have no surface yet and are
        not advertised here.

    ItemArtwork:
      type: object
      required: [kind, url]
      properties:
        kind:
          $ref: "#/components/schemas/ArtworkKind"
        url:
          type: string
          description: >
            GET path for the image. Present means this title has artwork of
            this kind; the bytes are fetched on demand at first request
            (ADR-0027 §5), so the first GET may be slow but will not 404 for
            want of a source. A kind missing from the array does not exist for
            this title, and the client draws the layout without it rather than
            requesting an image that cannot arrive.

    Rating:
      type: object
      required: [source, value]
      properties:
        source:
          type: string
          description: >
            Provider name as recorded, e.g. imdb, themoviedb,
            tomatometerallcritics, default. Not an enum: the set is whatever
            the NFO or provider carried.
        value:
          type: number
          format: double
        votes:
          type: integer
          format: int64
          nullable: true
        max:
          type: number
          format: double
          nullable: true
          description: >
            The maximum `value` is expressed against, when the scale of that
            source is known: 10 for imdb / themoviedb / tmdb, 100 for
            tomatometerallcritics. **Absent means unknown, and a client must
            not assume a scale** — render the number without a denominator.
            `default`, the NFO's unnamed rating, is the source that reaches
            this. The field exists because one array can carry a 0-100 score
            beside a 0-10 one, which no client can render honestly from
            `value` alone.

    CastMember:
      type: object
      required: [name]
      properties:
        name:
          type: string
        role:
          type: string
          nullable: true
        order:
          type: integer
          nullable: true
          description: Billing order as recorded; 0 is top billing.

    MediaItemDetail:
      description: >
        A MediaItem plus the canonical metadata for the entity it is bound to.
        Canonical fields are absent, never empty-but-present, when the item has
        no canonical row (ADR-0029 §1.3); the client falls back to the scan
        fields already in the MediaItem half.
      allOf:
        - $ref: "#/components/schemas/MediaItem"
        - type: object
          required: [itemKey]
          properties:
            itemKey:
              type: string
              description: >
                Opaque item_key (ADR-0035 item 11). Pass it back exactly as
                received; the grammar is not a parse contract.
            canonicalTitle:
              type: string
              nullable: true
              description: >
                Title from the canonical row. `title` stays the scan-derived
                one, so a disagreement between the two is visible rather than
                hidden by overwriting.
            plot:
              type: string
              nullable: true
              description: Episode overview for an episode, not the show's.
            runtimeMinutes:
              type: integer
              nullable: true
            airDate:
              type: string
              nullable: true
              description: ISO date; episodes only (ADR-0029 §1.2).
            genres:
              type: array
              items:
                type: string
              description: >
                Read from the show for an episode. Episode rows deliberately
                do not carry genres, so this is inherited rather than absent
                (ADR-0029 §1.2).
            ratings:
              type: array
              description: >
                Every source the record carried. An episode's own vote only;
                a show's score is not inherited down to its episodes.
              items:
                $ref: "#/components/schemas/Rating"
            cast:
              type: array
              description: Read from the show for an episode, like genres.
              items:
                $ref: "#/components/schemas/CastMember"
            artwork:
              type: array
              description: >
                Only the kinds this title has. For an episode these come from
                the show entity, which is where poster, backdrop and logo live
                (ADR-0029 §1.2 gives episode rows a still and nothing else).
              items:
                $ref: "#/components/schemas/ItemArtwork"
            seriesKey:
              type: string
              nullable: true
              description: >
                Opaque series_key (ADR-0039 item 2), for the link back to
                GET /api/v0/series. An episode's key is its show folder's
                binding (`tmdb:show:{id}` when bound, `folder:{libraryId}:{relpath}`
                when not); a movie is a series of one, so its key is its own
                `itemKey`.
            showTitle:
              type: string
              nullable: true

    Role:
      type: string
      enum: [owner, manager, member]
      description: >
        Account authority (ADR-0040 item 1). owner reaches everything and there
        is exactly one, enforced by a partial unique index rather than by
        convention. manager has full account powers except the three owner-only
        actions. member reaches themselves and the profiles under their own
        account.


        **Not a ranking.** Authority is the action list in ADR-0040 item 3, not
        a scale, so no client should compare these values. A precedence field
        is what that record rejects.

    SetupState:
      type: object
      required: [adminExists, libraryExists]
      description: >
        Two independent facts. Four reachable states, and the third is the only
        install we have: libraries present with no account, which is the
        dogfood database at roughly 24,800 items.
      properties:
        adminExists:
          type: boolean
          description: An account with role owner or manager exists.
        libraryExists:
          type: boolean

    BootstrapRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
        clientLabel:
          type: string
          description: Names this device in the session list. Defaults to a generic label.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        clientLabel: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, account]
      properties:
        token:
          type: string
          description: >
            Returned exactly once. The server stores only its SHA-256 and
            cannot reissue it. Send as `Authorization: Bearer`; the cookie set
            alongside carries the same value for media routes that cannot set
            a header.
        expiresAt:
          type: string
          format: date-time
          description: Absolute, 90 days. No sliding renewal and no refresh token.
        account:
          $ref: "#/components/schemas/Account"

    SessionView:
      type: object
      required: [account, scope]
      properties:
        account:
          $ref: "#/components/schemas/Account"
        scope:
          type: string
          enum: [account, profile]
          description: >
            `profile` once narrowed. Profile scope cannot administer the
            server and cannot write outside its own profile.
        activeProfile:
          $ref: "#/components/schemas/Profile"
        clientLabel: { type: string }
        expiresAt: { type: string, format: date-time }

    Account:
      type: object
      required: [id, username, role]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        maxConcurrentSessions:
          type: integer
          nullable: true
          description: >
            Concurrent playback across every profile on this account; null
            means no per-account limit, which is the shipped default. The shape
            is decided by ADR-0034 item 8 and **enforced in B2-9** at playback
            session creation.
        maxBitrateBps:
          type: integer
          nullable: true
          description: >
            Account policy bitrate ceiling in bits per second; null means no
            ceiling, which is the shipped default (ADR-0022 §5 as amended
            2026-09-12). Advisory until trusted-proxy work lands: surfaced on
            this response and on `playbackInfo`, not byte-enforced.
        maxHeight:
          type: integer
          nullable: true
          description: >
            Account policy height ceiling; null means no ceiling, which is the
            shipped default. Advisory like `maxBitrateBps`.

    Profile:
      type: object
      required: [profileRef, name, simpleInterface]
      properties:
        profileRef:
          type: string
          description: >
            Opaque and durable (ADR-0034 item 6). Never `profileId`, which
            ADR-0022 uses for the client capability profile. Clients treat it
            as opaque exactly as they treat `itemKey`.
        name: { type: string }
        classificationCap:
          type: string
          nullable: true
          description: Null is uncapped. What a cap means is B2-D's decision.
        simpleInterface: { type: boolean }
        preferredLanguage:
          type: string
          nullable: true
          description: >
            ISO-639-1-shaped lowercase two-letter code, or null for no
            preference (ADR-0038 item 1). One field for audio and subtitles.
        subtitleDefault:
          type: string
          enum: [auto, off]
          description: >
            `auto` runs the ADR-0024 rule and may select nothing; `off` selects
            nothing on purpose. The two are different choices (ADR-0038
            item 1).

    PlaybackPolicyRequest:
      type: object
      additionalProperties: false
      description: >
        Full replacement of the three account playback ceilings. An omitted
        field means null, so `{}` clears all three.
      properties:
        maxConcurrentSessions:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4294967295
          description: >
            Concurrent playback sessions across every profile. The maximum is
            `u32::MAX`, the bound the enforcement path reads.
        maxBitrateBps:
          type: integer
          nullable: true
          minimum: 1
          description: Account policy bitrate ceiling in bits per second.
        maxHeight:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4294967295
          description: Account policy height ceiling in pixels.

    CreateAccountRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string }
        password: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        profileName:
          type: string
          description: Name for the profile created alongside the account.

    WatchReportRequest:
      type: object
      additionalProperties: false
      required: [positionMs, durationMs]
      description: >
        The whole write body (ADR-0035 amendment item 1). `played`, `hidden`
        and a client timestamp are not fields, so a client cannot set them. A
        prohibited or unknown field is refused with the typed 422 rather than
        ignored: the body is exactly these two values.
      properties:
        positionMs:
          type: integer
          format: int64
          minimum: 0
          description: Current playback position in milliseconds.
        durationMs:
          type: integer
          format: int64
          minimum: 1
          description: >
            Duration of the file that was playing, in milliseconds. A snapshot,
            not a foreign key to the current file (ADR-0035 item 1).

    WatchState:
      type: object
      required:
        - itemKey
        - positionMs
        - durationMs
        - played
        - hidden
        - firstPlayedAt
        - lastPlayedAt
      properties:
        itemKey:
          type: string
          description: Opaque item key (ADR-0025 §1), returned as received.
        positionMs:
          type: integer
          format: int64
        durationMs:
          type: integer
          format: int64
        played:
          type: boolean
          description: Derived from the 90% ceiling, never client-supplied.
        hidden:
          type: boolean
          description: >
            Reserved for the later rollup block. Always false until that block
            writes it; this route preserves whatever it finds.
        firstPlayedAt:
          type: string
          format: date-time
          description: >
            Server time of the first qualifying write at or above 2%. Preserved
            across later writes.
        lastPlayedAt:
          type: string
          format: date-time
          description: Server time of the latest qualifying write.

    WatchStateEnvelope:
      type: object
      required: [state]
      properties:
        state:
          description: >
            The stored state, or null when the item has none. A resolved item
            with no state and an unresolvable key are different answers: this
            one is 200 with null, the other is 404.
          oneOf:
            - $ref: "#/components/schemas/WatchState"
            - type: "null"

    CreateProfileRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        accountId:
          type: integer
          format: int64
          description: >
            Owner and manager only. Omitted means the session's own account,
            which is the only value a member may reach.
        classificationCap:
          type: string
          nullable: true
        simpleInterface:
          type: boolean
          default: false
        preferredLanguage:
          type: string
          nullable: true
          description: >
            ISO-639-1-shaped lowercase two-letter code, or null. Any other
            value is the typed 422.
        subtitleDefault:
          type: string
          enum: [auto, off]
          description: >
            Omitted means `auto`, so an existing client that sends neither
            preference field gets the same defaults as a create with neither
            field (ADR-0038 amendment §2).

    UpdateProfileRequest:
      type: object
      additionalProperties: false
      description: >
        A full replacement of the two preference fields (ADR-0038 amendment
        §2). An omitted `preferredLanguage` clears it and an omitted
        `subtitleDefault` means `auto`, the same defaults a create with neither
        field gets.
      properties:
        preferredLanguage:
          type: string
          nullable: true
          description: >
            ISO-639-1-shaped lowercase two-letter code, or null. Any other
            value is the typed 422.
        subtitleDefault:
          type: string
          enum: [auto, off]

    TrackDescription:
      type: object
      additionalProperties: false
      required: [kind, sdh, forced]
      description: >
        Language, kind and flags of one stored choice (ADR-0024 §3,
        ADR-0038 item 2). Never a stream index.
      properties:
        language:
          type: string
          nullable: true
          description: ISO 639-1 when known; null when the description does not name one.
        kind:
          type: string
          enum: [main, commentary, signs]
        sdh:
          type: boolean
        forced:
          type: boolean

    SubtitleChoice:
      description: >
        The three-valued subtitle choice (ADR-0038 item 4). `unset` and `off`
        are deliberately distinct.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [unset] }
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, enum: [off] }
        - type: object
          additionalProperties: false
          required: [mode, track]
          properties:
            mode: { type: string, enum: [track] }
            track:
              $ref: "#/components/schemas/TrackDescription"

    TrackChoiceRequest:
      type: object
      additionalProperties: false
      required: [subtitle]
      description: The full-replacement body (ADR-0038 amendment §2).
      properties:
        audio:
          oneOf:
            - $ref: "#/components/schemas/TrackDescription"
            - type: "null"
        subtitle:
          $ref: "#/components/schemas/SubtitleChoice"

    TrackChoice:
      type: object
      required: [seriesKey, subtitle, updatedAt]
      properties:
        seriesKey:
          type: string
          description: Opaque series key (ADR-0039 item 2), returned as received.
        audio:
          oneOf:
            - $ref: "#/components/schemas/TrackDescription"
            - type: "null"
        subtitle:
          $ref: "#/components/schemas/SubtitleChoice"
        updatedAt:
          type: string
          format: date-time
          description: Server time of the latest write.

    TrackChoiceEnvelope:
      type: object
      required: [choice]
      properties:
        choice:
          $ref: "#/components/schemas/TrackChoice"

    MetadataStatus:
      type: string
      enum: [pending, matched, ready, unmatched]
      description: >
        Metadata pipeline state (ADR-0026). `pending` = search tier queued;
        `matched` = identity found, detail enrichment pending; `ready` = full
        metadata bound; `unmatched` = search terminal no-match.

    UnitKind:
      type: string
      enum: [series, movie]
      description: >
        What one browse unit collects. `series` is a show and its episodes,
        across every folder bound to it (ADR-0039 item 8). `movie` is a film
        and its files, which ADR-0039 item 2 treats as a series of one keyed by
        its own item_key; two rips of one film are one unit, not two
        (ADR-0025 §2).

    UnitIdentity:
      type: string
      enum: [bound, entityOnly, unidentified]
      description: >
        Which of ADR-0039 item 6's two edges answers for this unit. `bound` =
        the folder is bound to a show entity (a `series` row), or the movie
        holds a provider link. `entityOnly` = the folder has no binding but its
        episodes name a show entity, so the show is known and the folder is
        not; these are visible with canonical metadata and this marker rather
        than hidden. `unidentified` = neither edge answers, which is the
        below-floor fraction ADR-0025 §4 prices.

    LibraryUnit:
      type: object
      required: [seriesKey, kind, identity, title, itemCount]
      properties:
        seriesKey:
          type: string
          description: >
            Opaque series_key (ADR-0039 item 2). Pass it to GET /api/v0/series.
        kind:
          $ref: "#/components/schemas/UnitKind"
        identity:
          $ref: "#/components/schemas/UnitIdentity"
        title:
          type: string
          description: >
            Canonical show or movie title when the unit has one, otherwise the
            show folder's name (or the file's title for a movie).
        year:
          type: integer
          nullable: true
        itemCount:
          type: integer
          format: int64
          description: >
            Media rows this unit collects, scoped to the library that was
            asked. A show bound in two libraries counts separately in each,
            while GET /api/v0/series returns the union (ADR-0039 item 8).
        itemId:
          type: integer
          format: int64
          nullable: true
          description: >
            The media row to open, present only when the unit collects exactly
            one. A movie with two files (ADR-0025 §2) omits it rather than
            pointing at one version arbitrarily; open it through
            GET /api/v0/series instead.
        posterUrl:
          type: string
          nullable: true
          description: >
            Artwork path for this unit, present only when the unit has a
            provider key to serve art under (ADR-0027). The image itself may
            not be cached yet, in which case the GET returns 404.

    UnitCounts:
      type: object
      required:
        - units
        - bound
        - entityOnly
        - unidentified
        - items
      properties:
        units:
          type: integer
          format: int64
        bound:
          type: integer
          format: int64
        entityOnly:
          type: integer
          format: int64
        unidentified:
          type: integer
          format: int64
        items:
          type: integer
          format: int64
          description: >
            Media rows covered by the units. Equal to the library's itemCount:
            grouping never drops a row.
        showEntitiesWithoutBinding:
          type: integer
          format: int64
          nullable: true
          description: >
            Shows libraries only. Show entities (`metadata_canonical` rows at
            `entity_kind='tv'`) that no `series` row binds anywhere on the
            server. Server-wide rather than per-library because a show entity
            is not library-scoped (ADR-0039 item 1). These produce no unit,
            because a unit is a folder of files; the count is here so they are
            not invisible.

    LibraryUnits:
      type: object
      required: [libraryId, libraryKind, unitKind, units, counts]
      properties:
        libraryId:
          type: integer
          format: int64
        libraryKind:
          $ref: "#/components/schemas/LibraryKind"
        unitKind:
          $ref: "#/components/schemas/UnitKind"
          description: The kind every unit in this response carries.
        units:
          type: array
          items:
            $ref: "#/components/schemas/LibraryUnit"
        counts:
          $ref: "#/components/schemas/UnitCounts"

    SeriesEpisode:
      type: object
      required:
        - itemId
        - itemKey
        - title
        - canonicalNumbering
        - path
        - probeStatus
        - metadataStatus
      properties:
        itemId:
          type: integer
          format: int64
        itemKey:
          type: string
          description: Opaque item_key (ADR-0035 item 11).
        title:
          type: string
          description: Canonical episode title when bound, otherwise the file's.
        season:
          type: integer
          nullable: true
          description: Canonical season number; null when the episode is unbound.
        episode:
          type: integer
          nullable: true
          description: Canonical episode number; null when the episode is unbound.
        fileSeason:
          type: integer
          nullable: true
          description: >
            Season parsed from the filename at scan. Present so a numbering
            disagreement is visible; ordering never uses it (ADR-0035 item 8).
        fileEpisode:
          type: integer
          nullable: true
        airDate:
          type: string
          nullable: true
        canonicalNumbering:
          type: boolean
          description: >
            Whether season and episode came from the canonical row. False
            means the episode is in the unnumbered list.
        path:
          type: string
          description: Absolute path, reconstructed like MediaItem.path.
        probeStatus:
          $ref: "#/components/schemas/ProbeStatus"
        metadataStatus:
          $ref: "#/components/schemas/MetadataStatus"

    SeriesSeason:
      type: object
      required: [season, episodes]
      properties:
        season:
          type: integer
          description: Canonical season number. 0 is the specials season.
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/SeriesEpisode"

    SeriesDetail:
      type: object
      required: [seriesKey, kind, identity, title, itemCount, seasons, unnumbered]
      properties:
        seriesKey:
          type: string
        kind:
          $ref: "#/components/schemas/UnitKind"
        identity:
          $ref: "#/components/schemas/UnitIdentity"
        title:
          type: string
        year:
          type: integer
          nullable: true
        plot:
          type: string
          nullable: true
        posterUrl:
          type: string
          nullable: true
        itemCount:
          type: integer
          format: int64
        seasons:
          type: array
          description: >
            Seasons in canonical order, episodes in canonical order within
            each. Filename order is never used (ADR-0035 item 8).
          items:
            $ref: "#/components/schemas/SeriesSeason"
        unnumbered:
          type: array
          description: >
            Media rows under this unit with no canonical numbering, ordered by
            path. ADR-0035 item 8: unmatched episodes group but do not order,
            so they are listed rather than folded into a season. A movie's
            files are always here, since a film has no episode numbering.
          items:
            $ref: "#/components/schemas/SeriesEpisode"

    ScanJobAccepted:
      type: object
      required: [jobId, libraryId]
      properties:
        jobId:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64

    ScanJob:
      type: object
      required:
        - id
        - libraryId
        - state
        - added
        - updated
        - removed
        - unchanged
        - probed
        - errors
        - startedAt
        - kind
        - skippedOutsideRoot
        - deferredRemove
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ScanJobState"
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
        probed:
          type: integer
        errors:
          type: integer
        indexDurationMs:
          type: integer
          format: int64
          nullable: true
          description: Wall time of the index pass; Gate 1 measures this.
        probeDurationMs:
          type: integer
          format: int64
          nullable: true
        error:
          type: string
          nullable: true
          description: >
            Failure message. Repoint refusals use stable prefixes
            `repoint_empty_match` or `repoint_below_retain_threshold` (ADR-0030).
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        kind:
          type: string
          description: "`scan` or `repoint` (ADR-0030)."
          enum: [scan, repoint]
        candidatePath:
          type: string
          nullable: true
          description: Candidate root for a repoint job; absent on ordinary scans.
        skippedOutsideRoot:
          type: integer
          format: int64
          description: >
            Files walked but not indexed because they were outside the library
            root (ADR-0030).
        deferredRemove:
          type: integer
          format: int64
          description: >
            On `kind=repoint` jobs: count of existing media rows that missed
            the new root keep-set and were left in place (delete_missing
            deferred to the next ordinary scan). Zero on ordinary scans
            (ADR-0030).

    ProgressDisplay:
      type: string
      enum: [none, count, bar]
      description: >
        What the server says this line of progress supports. `count` = a
        running number with no denominator, because the walk is still
        discovering files and a percentage would move backwards. `bar` = the
        total is fixed and large enough that a percentage is worth drawing.
        `none` = nothing to show. Clients render what this says; they do not
        derive a percentage from any other field.

    ProbeProgress:
      type: object
      required: [display, done, queued, errors]
      properties:
        display:
          $ref: "#/components/schemas/ProgressDisplay"
        done:
          type: integer
          format: int64
          description: Probes finished by this job. Cumulative, never a queue depth.
        queued:
          type: integer
          format: int64
          description: Items waiting to be probed right now. A depth, not a total.
        errors:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
          nullable: true
          description: >
            done + queued, present only once the index pass has finished. Null
            while the walk runs, because the denominator is still growing and
            a percentage built on it would move backwards.

    MetadataProgress:
      type: object
      required: [display, pending, ready, unmatched]
      properties:
        display:
          $ref: "#/components/schemas/ProgressDisplay"
          description: >
            `count` while work remains, `none` otherwise. Never `bar`: metadata
            drains on its own schedule and folding it into the probe bar would
            report one number for two jobs that finish at different times.
        pending:
          type: integer
          format: int64
          description: Items at metadata_status pending or matched (ADR-0026 §8.1).
        ready:
          type: integer
          format: int64
        unmatched:
          type: integer
          format: int64

    ScanProgress:
      type: object
      required: [libraryId, indexPassComplete, found, probe, metadata]
      properties:
        libraryId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
          nullable: true
          description: Most recent scan job for this library; null if never scanned.
        state:
          $ref: "#/components/schemas/ScanJobState"
          description: State of that job. Absent when the library has no job.
        indexPassComplete:
          type: boolean
          description: >
            Whether the walk has stopped adding to the probe queue. False while
            the job is queued or indexing.
        found:
          type: integer
          format: int64
          description: >
            Media rows in the library right now. During the index pass this is
            the running discovery count; after it, the library total.
        probe:
          $ref: "#/components/schemas/ProbeProgress"
        metadata:
          $ref: "#/components/schemas/MetadataProgress"

    PlaybackInfo:
      type: object
      required: [itemId, playbackMethod, reason, mimeType, subtitleStatus]
      properties:
        itemId:
          type: integer
          format: int64
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"
        reason:
          type: string
          description: Why the decision engine chose this method
        streamUrl:
          type: string
          description: Present only when playbackMethod is directPlay
        sessionsUrl:
          type: string
          description: >
            Present when playbackMethod is remux or transcode. POST here to
            start an HLS session (ADR-0011).
        mimeType:
          type: string
          description: >
            Source MIME for directPlay; application/vnd.apple.mpegurl for
            session playback.
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        audioTracks:
          type: array
          description: >
            Audio tracks in the source (ADR-0012). Listed the same way for
            directPlay, remux, and transcode: the client asks for a trackId
            and never reasons about the delivery path to find tracks. Direct
            play switches client-side; sessions take audioTrackId at start.
          items:
            $ref: "#/components/schemas/AudioTrack"
        subtitleStatus:
          $ref: "#/components/schemas/SubtitleStatus"
        subtitleTracks:
          type: array
          description: >
            Subtitle tracks (ADR-0010 / ADR-0013 / ADR-0018). Soft text and
            burn-in (ASS/SSA/PGS) share one shape; differ by render. Soft
            tracks expose url when WebVTT is extracted; burnIn tracks are
            selected via subtitleTrackId on session start. Listed the same
            way for directPlay, remux, and transcode.
          items:
            $ref: "#/components/schemas/SubtitleTrack"
        audioReason:
          type: string
          nullable: true
          description: >
            Why the audio track was selected (ADR-0038 item 5). Runs the same
            precedence a session does: stored description, then profile
            default, then the ADR-0024 rank rule, then the audio last resort.
        subtitleReason:
          type: string
          nullable: true
          description: >
            Why a subtitle track was selected, or why none was. Stored `off`
            and a profile default of `off` both select none, and say so.
        policyMaxBitrateBps:
          type: integer
          format: int64
          nullable: true
          description: >
            The account policy bitrate ceiling, surfaced whether or not applied
            (ADR-0022 §5 as amended 2026-09-12). Absent means no account
            ceiling.
        policyMaxHeight:
          type: integer
          format: int64
          nullable: true
          description: >
            The account policy height ceiling, surfaced whether or not applied.

    AudioTrack:
      type: object
      required: [trackId, codec, channels, default, streamIndex]
      properties:
        trackId:
          type: string
          description: >
            Stable id `e{streamIndex}`, the same scheme as embedded subtitles
            (ADR-0010 / ADR-0012).
          pattern: '^e[0-9]+$'
        codec:
          type: string
          description: Source codec (aac, ac3, eac3, dts, ...)
        language:
          type: string
          nullable: true
          description: Normalised ISO 639-1 when known; null if unlabelled
        channels:
          type: integer
          minimum: 1
          description: >
            Channel count. Tracks above the client ceiling are downmixed to
            stereo by the session with an explicit pan matrix.
        channelLayout:
          type: string
          nullable: true
          description: FFmpeg layout name (stereo, 5.1, 7.1, ...) when reported
        label:
          type: string
          nullable: true
          description: Optional title tag from the container (e.g. Commentary)
        default:
          type: boolean
          description: >
            Container default disposition. Exactly one track is default: the
            flagged one, else the first.
        streamIndex:
          type: integer
          minimum: 0
          description: Absolute ffprobe stream index

    SubtitleRender:
      type: string
      enum: [soft, burnIn]
      description: >
        soft = WebVTT delivery (ADR-0010 / ADR-0013). burnIn = pixels burned
        into the video encode when selected via subtitleTrackId (ADR-0018).

    SubtitleTrack:
      type: object
      required: [trackId, source, codec, forced, sdh, render]
      properties:
        trackId:
          type: string
          description: >
            Stable id used in the VTT URL or burn-in selection. Embedded
            `e{N}`; sidecar `s` / `s-{suffix}` from the filename (ADR-0010).
        source:
          type: string
          enum: [embedded, sidecar]
        codec:
          type: string
          description: Source codec or sidecar format (subrip, srt, vtt, ass, ...)
        language:
          type: string
          nullable: true
          description: Normalised ISO 639-1 when known; null if unlabelled
        label:
          type: string
          nullable: true
          description: Optional title tag from the container (embedded)
        forced:
          type: boolean
          description: Forced-subtitle flag (selection differs from full dialogue)
        sdh:
          type: boolean
          description: SDH / hearing-impaired flag from the sidecar name
        streamIndex:
          type: integer
          minimum: 0
          nullable: true
          description: Absolute ffprobe stream index when source is embedded
        render:
          $ref: "#/components/schemas/SubtitleRender"
        readiness:
          $ref: "#/components/schemas/SubtitleTrackReadiness"
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >
            Monotonic growth counter for this track's WebVTT body. Bumps when
            the server writes more cues (partial) or the final file. Clients
            that reload on growth compare this field; they do not infer growth
            from content length. Absent for burnIn tracks.
        url:
          type: string
          nullable: true
          description: >
            GET path for the WebVTT body when this track is soft and served
            (partial or complete). Absent while preparing, and for burnIn
            tracks (ADR-0018).

    EncoderStatus:
      type: string
      enum: [verified, failed, unavailable]
      description: >
        verified = short encode+demux succeeded; failed = advertised but
        verify failed; unavailable = not in this ffmpeg build.

    EncoderCandidate:
      type: object
      required: [name, backend, status]
      properties:
        name:
          type: string
          description: FFmpeg encoder name (e.g. libx264, h264_videotoolbox)
        backend:
          type: string
          description: Backend family (software, videotoolbox, nvenc, qsv, vaapi, ...)
        status:
          $ref: "#/components/schemas/EncoderStatus"
        reason:
          type: string
          nullable: true
          description: Required when status is not verified; null when verified

    TranscodeCapabilities:
      type: object
      required: [preferredH264Encoder, encoders]
      properties:
        ffmpegVersion:
          type: string
          nullable: true
        preferredH264Encoder:
          type: string
          description: >
            Encoder name from the preferred session-shaped encode leg
            (ADR-0009). Sessions use the full leg, not the name alone.
        preferredDevice:
          type: string
          nullable: true
          description: >
            Device path recorded when the preferred leg binds one
            (e.g. /dev/dri/renderD128 for VAAPI). Null for software, QSV
            sysmem, and VideoToolbox.
        encoders:
          type: array
          items:
            $ref: "#/components/schemas/EncoderCandidate"
