openapi: 3.1.0
info:
  title: Nightjar API
  version: 0.2.0
  description: |
    Public API contract. Server handlers and the web client are built against
    this file. v0: libraries, items, playback info, direct-play streams, and
    HLS playback sessions (ADR-0011).
  license:
    name: GPL-3.0-only
servers:
  - url: http://localhost:8096
    description: Local default
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/v0/libraries:
    get:
      operationId: listLibraries
      summary: List all libraries
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                type: object
                required: [libraries]
                properties:
                  libraries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Library"
    post:
      operationId: createLibrary
      summary: Create a library pointing at a local folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}:
    get:
      operationId: getLibrary
      summary: Get one library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/scan:
    post:
      operationId: scanLibrary
      summary: Start an async library scan job (ADR-0004)
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "202":
          description: Scan job accepted (or existing active job returned)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJobAccepted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/scan-jobs/{jobId}:
    get:
      operationId: getScanJob
      summary: Poll scan job state and counts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Scan job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/libraries/{libraryId}/items:
    get:
      operationId: listLibraryItems
      summary: List media items in a library
      parameters:
        - $ref: "#/components/parameters/LibraryId"
      responses:
        "200":
          description: Items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}:
    get:
      operationId: getItem
      summary: Get one media item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/playback-info:
    get:
      operationId: getPlaybackInfo
      summary: Playback method and delivery URL for an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Playback info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/subtitles/{trackId}.vtt:
    get:
      operationId: getSubtitleVtt
      summary: WebVTT for one text subtitle track (ADR-0010)
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: trackId
          in: path
          required: true
          description: >
            Stable track id (ADR-0010): `e{streamIndex}` for embedded,
            `s` / `s-{suffix}` for filesystem sidecars.
          schema:
            type: string
            pattern: '^[es]([A-Za-z0-9._-]*)$'
      responses:
        "200":
          description: WebVTT body
          content:
            text/vtt:
              schema:
                type: string
        "404":
          description: Item or serveable subtitle track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/items/{itemId}/stream:
    get:
      operationId: streamItem
      summary: Byte stream for playback (supports HTTP Range)
      description: >
        Serves the original file for directPlay items. Remux and transcode
        items are delivered as HLS sessions (ADR-0011).
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Entire file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Item needs an HLS session; POST /api/v0/items/{itemId}/sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "416":
          description: Range not satisfiable

  /api/v0/items/{itemId}/sessions:
    post:
      operationId: startTranscodeSession
      summary: Start an HLS playback session for an item
      description: >
        ADR-0011. Returns 202 with sessionId and playlistUrl. Remux items get
        a stream-copy session, transcode items a re-encoding one; the shape is
        identical. Each POST creates a session; seek with ?startMs= on the
        playlist restarts that session in place. Concurrent sessions are capped
        via NIGHTJAR_HLS_MAX_SESSIONS (default 3).
      parameters:
        - $ref: "#/components/parameters/ItemId"
        - name: startMs
          in: query
          required: false
          description: Encode window start in milliseconds (default 0)
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: audioTrackId
          in: query
          required: false
          description: >
            Audio track to map, from playbackInfo.audioTracks (ADR-0012).
            Defaults to the flagged default track, else the first. Switching
            audio starts a new session at the current position and DELETEs the
            old one.
          schema:
            type: string
            pattern: '^e[0-9]+$'
      responses:
        "202":
          description: Session started for this item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: Item direct plays, or is not ready for a session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Session cap full; retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/master.m3u8:
    get:
      operationId: getSessionMasterPlaylist
      summary: HLS master playlist for a playback session
      description: >
        ADR-0008 / ADR-0010. Declares the single video rendition (index.m3u8)
        and optional SUBTITLES group. playlistUrl from session start points
        here. Seek via startMs uses the same window-move rules as the media
        playlist.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: startMs
          in: query
          required: false
          description: Encode window start; a change restarts this session there
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: HLS master playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session not found or playlist not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/index.m3u8:
    get:
      operationId: getSessionPlaylist
      summary: HLS media playlist for a playback session
      description: >
        Media playlist path is stable (ADR-0008). Segment URIs are relative
        init.mp4 / segNNN.m4s. Also accepts startMs for seek.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: startMs
          in: query
          required: false
          description: Encode window start; a change restarts this session there
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: HLS playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session not found or playlist not ready yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/subs/{asset}:
    get:
      operationId: getSessionSubtitlePlaylist
      summary: One-segment subtitle media playlist for a session track
      description: >
        ADR-0010. EXT-X-MEDIA URI target. References the item WebVTT URL for
        the snapshotted trackId.
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: asset
          in: path
          required: true
          description: "{trackId}.m3u8 (e.g. e2.m3u8, s-en.m3u8)"
          schema:
            type: string
            pattern: '^[es][A-Za-z0-9._-]*\.m3u8$'
      responses:
        "200":
          description: HLS subtitle media playlist
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
        "404":
          description: Session or track not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}/{asset}:
    get:
      operationId: getSessionAsset
      summary: HLS init segment or media segment for a session
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: asset
          in: path
          required: true
          schema:
            type: string
            pattern: '^(init\.mp4|seg[0-9]+\.m4s)$'
      responses:
        "200":
          description: Segment bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Session or asset not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            Segment not on disk yet (encoder still cooking). Retryable; do not
            treat as a permanent miss.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/sessions/{sessionId}:
    delete:
      operationId: deleteTranscodeSession
      summary: Stop a playback session and reap its FFmpeg process
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Stopped (or already gone)
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v0/system/transcode:
    get:
      operationId: getTranscodeCapabilities
      summary: Verified H.264 encode capabilities for this process
      description: >
        Startup detection-by-verification (ADR-0009). Each candidate is
        verified | failed | unavailable with a reason when not verified.
        preferredH264Encoder is what new HLS sessions use for -c:v.
      responses:
        "200":
          description: Capability readout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeCapabilities"

components:
  parameters:
    LibraryId:
      name: libraryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        core:
          type: string

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    LibraryKind:
      type: string
      enum: [movies, shows]

    MediaKind:
      type: string
      enum: [movie, episode, unknown]

    ProbeStatus:
      type: string
      enum: [indexed, probed, error]
      description: >
        indexed = walk+filename done, codecs pending; probed = ffprobe ok;
        error = ffprobe failed (see scanError).

    SubtitleStatus:
      type: string
      enum: [pending, ready, none, error]
      description: >
        pending = extract queued or in progress; ready = WebVTT on disk;
        none = no serveable text tracks; error = last extract failed
        (ADR-0013).

    ScanJobState:
      type: string
      enum: [queued, indexing, probing, completed, failed]

    PlaybackMethod:
      type: string
      enum: [directPlay, remux, transcode]
      description: >
        directPlay = browser plays the original file; remux = same codecs in a
        container the client cannot open, delivered as a stream-copy HLS
        session; transcode = needs re-encoding, delivered as an encoding HLS
        session. Pending or failed probes report transcode.

    TranscodeSession:
      type: object
      required: [sessionId, itemId, playlistUrl, videoEncoder, encoderKind]
      properties:
        sessionId:
          type: string
        itemId:
          type: integer
          format: int64
        playlistUrl:
          type: string
          description: >
            Path to the HLS master playlist for this session (master.m3u8).
            The media playlist remains at index.m3u8 (ADR-0008).
        videoEncoder:
          type: string
          description: >
            FFmpeg encoder currently used by this session, or "copy" when the
            session stream-copies video (remux).
        encoderKind:
          type: string
          enum: [hardware, software, copy]
          description: >
            Whether videoEncoder is a hardware encoder, a software encoder, or
            a stream copy.

    Library:
      type: object
      required: [id, name, path, kind, itemCount]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        path:
          type: string
        kind:
          $ref: "#/components/schemas/LibraryKind"
        itemCount:
          type: integer
          format: int64

    CreateLibraryRequest:
      type: object
      required: [name, path, kind]
      properties:
        name:
          type: string
          minLength: 1
        path:
          type: string
          minLength: 1
        kind:
          $ref: "#/components/schemas/LibraryKind"

    MediaItem:
      type: object
      required: [id, libraryId, path, title, kind, sizeBytes, probeStatus, subtitleStatus, playbackMethod]
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        path:
          type: string
        title:
          type: string
        kind:
          $ref: "#/components/schemas/MediaKind"
        year:
          type: integer
          nullable: true
        season:
          type: integer
          nullable: true
        episode:
          type: integer
          nullable: true
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        width:
          type: integer
          nullable: true
        height:
          type: integer
          nullable: true
        sizeBytes:
          type: integer
          format: int64
        probeStatus:
          $ref: "#/components/schemas/ProbeStatus"
        subtitleStatus:
          $ref: "#/components/schemas/SubtitleStatus"
        scanError:
          type: string
          nullable: true
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"

    ScanJobAccepted:
      type: object
      required: [jobId, libraryId]
      properties:
        jobId:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64

    ScanJob:
      type: object
      required:
        - id
        - libraryId
        - state
        - added
        - updated
        - removed
        - unchanged
        - probed
        - errors
        - startedAt
      properties:
        id:
          type: integer
          format: int64
        libraryId:
          type: integer
          format: int64
        state:
          $ref: "#/components/schemas/ScanJobState"
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
        probed:
          type: integer
        errors:
          type: integer
        indexDurationMs:
          type: integer
          format: int64
          nullable: true
          description: Wall time of the index pass; Gate 1 measures this.
        probeDurationMs:
          type: integer
          format: int64
          nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true

    PlaybackInfo:
      type: object
      required: [itemId, playbackMethod, reason, mimeType, subtitleStatus]
      properties:
        itemId:
          type: integer
          format: int64
        playbackMethod:
          $ref: "#/components/schemas/PlaybackMethod"
        reason:
          type: string
          description: Why the decision engine chose this method
        streamUrl:
          type: string
          description: Present only when playbackMethod is directPlay
        sessionsUrl:
          type: string
          description: >
            Present when playbackMethod is remux or transcode. POST here to
            start an HLS session (ADR-0011).
        mimeType:
          type: string
          description: >
            Source MIME for directPlay; application/vnd.apple.mpegurl for
            session playback.
        durationMs:
          type: integer
          format: int64
          nullable: true
        container:
          type: string
          nullable: true
        videoCodec:
          type: string
          nullable: true
        audioCodec:
          type: string
          nullable: true
        audioTracks:
          type: array
          description: >
            Audio tracks in the source (ADR-0012). Listed the same way for
            directPlay, remux, and transcode: the client asks for a trackId
            and never reasons about the delivery path to find tracks. Direct
            play switches client-side; sessions take audioTrackId at start.
          items:
            $ref: "#/components/schemas/AudioTrack"
        subtitleStatus:
          $ref: "#/components/schemas/SubtitleStatus"
        subtitleTracks:
          type: array
          description: >
            Text subtitle tracks (ADR-0010 / ADR-0013). Embedded and filesystem
            sidecars share one shape; differ by source. url is present only
            when the WebVTT file is already extracted. Listed the same way for
            directPlay, remux, and transcode.
          items:
            $ref: "#/components/schemas/SubtitleTrack"

    AudioTrack:
      type: object
      required: [trackId, codec, channels, default, streamIndex]
      properties:
        trackId:
          type: string
          description: >
            Stable id `e{streamIndex}`, the same scheme as embedded subtitles
            (ADR-0010 / ADR-0012).
          pattern: '^e[0-9]+$'
        codec:
          type: string
          description: Source codec (aac, ac3, eac3, dts, ...)
        language:
          type: string
          nullable: true
          description: Normalised ISO 639-1 when known; null if unlabelled
        channels:
          type: integer
          minimum: 1
          description: >
            Channel count. Tracks above the client ceiling are downmixed to
            stereo by the session with an explicit pan matrix.
        channelLayout:
          type: string
          nullable: true
          description: FFmpeg layout name (stereo, 5.1, 7.1, ...) when reported
        label:
          type: string
          nullable: true
          description: Optional title tag from the container (e.g. Commentary)
        default:
          type: boolean
          description: >
            Container default disposition. Exactly one track is default: the
            flagged one, else the first.
        streamIndex:
          type: integer
          minimum: 0
          description: Absolute ffprobe stream index

    SubtitleTrack:
      type: object
      required: [trackId, source, codec, forced, sdh]
      properties:
        trackId:
          type: string
          description: >
            Stable id used in the VTT URL. Embedded `e{N}`; sidecar `s` /
            `s-{suffix}` from the filename (ADR-0010).
        source:
          type: string
          enum: [embedded, sidecar]
        codec:
          type: string
          description: Source codec or sidecar format (subrip, srt, vtt, ass, ...)
        language:
          type: string
          nullable: true
          description: Normalised ISO 639-1 when known; null if unlabelled
        label:
          type: string
          nullable: true
          description: Optional title tag from the container (embedded)
        forced:
          type: boolean
          description: Forced-subtitle flag (selection differs from full dialogue)
        sdh:
          type: boolean
          description: SDH / hearing-impaired flag from the sidecar name
        streamIndex:
          type: integer
          minimum: 0
          nullable: true
          description: Absolute ffprobe stream index when source is embedded
        url:
          type: string
          nullable: true
          description: >
            GET path for the WebVTT body when this track is served. Absent for
            ASS/SSA and other non-serveable tracks that are still listed.

    EncoderStatus:
      type: string
      enum: [verified, failed, unavailable]
      description: >
        verified = short encode+demux succeeded; failed = advertised but
        verify failed; unavailable = not in this ffmpeg build.

    EncoderCandidate:
      type: object
      required: [name, backend, status]
      properties:
        name:
          type: string
          description: FFmpeg encoder name (e.g. libx264, h264_videotoolbox)
        backend:
          type: string
          description: Backend family (software, videotoolbox, nvenc, qsv, vaapi, ...)
        status:
          $ref: "#/components/schemas/EncoderStatus"
        reason:
          type: string
          nullable: true
          description: Required when status is not verified; null when verified

    TranscodeCapabilities:
      type: object
      required: [preferredH264Encoder, encoders]
      properties:
        ffmpegVersion:
          type: string
          nullable: true
        preferredH264Encoder:
          type: string
          description: Encoder name used for new HLS sessions (-c:v)
        encoders:
          type: array
          items:
            $ref: "#/components/schemas/EncoderCandidate"
