name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - name: Fail if generated client drifted from OpenAPI
        run: git diff --exit-code -- src/lib/api/schema.d.ts

  web:
    needs: openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build

  server:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # FFmpeg tests must fail, not skip, when ffmpeg is missing in CI.
          NIGHTJAR_TEST_REQUIRE_FFMPEG: "1"
      - run: cargo build --release -p nightjar-api

  gate1:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build web for embed
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        working-directory: server
        run: cargo build --release -p nightjar-api
      - name: Generate corpus seeds
        run: chmod +x testdata/generate.sh testdata/bench_10k.sh scripts/gate1_ci.sh scripts/gate1_scan_10k.sh scripts/ci_benchmark_summary.py && ./testdata/generate.sh
      - name: Gate 1 smoke (startup, RAM, WAL kill-9, Range)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: ./scripts/gate1_ci.sh | tee /tmp/gate1_ci.txt
      - name: Gate 1 scan 10k
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
          SCAN_BUDGET_S: "60"
          # ADR-0004: floor catches half-speed regressions, not runner jitter.
          # ubuntu-latest often sits ~50 files/sec; 40 still fails a true halving.
          PROBE_FLOOR_FPS: "40"
        run: ./scripts/gate1_scan_10k.sh | tee /tmp/gate1_scan.txt
      - name: Benchmark delta (report only)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: |
          python3 scripts/ci_benchmark_summary.py /tmp/gate1_ci.txt /tmp/gate1_scan.txt notes/ci/gate-metrics-baseline.json \
            | tee /tmp/gate-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-metrics
          path: /tmp/gate-metrics.json
