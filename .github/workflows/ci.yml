name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - name: Fail if generated client drifted from OpenAPI
        run: git diff --exit-code -- src/lib/api/schema.d.ts

  web:
    needs: openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build

  server:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p nightjar-api

  gate1:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build web for embed
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        working-directory: server
        run: cargo build --release -p nightjar-api
      - name: Generate corpus seeds
        run: chmod +x testdata/generate.sh testdata/bench_10k.sh scripts/gate1_ci.sh scripts/gate1_scan_10k.sh && ./testdata/generate.sh
      - name: Gate 1 smoke (startup, RAM, WAL kill-9, Range)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: ./scripts/gate1_ci.sh
      - name: Gate 1 scan 10k
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
          SCAN_BUDGET_S: "60"
        run: ./scripts/gate1_scan_10k.sh
