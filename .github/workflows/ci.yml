name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A docs-only pull request needs no Rust build, no node build and no 10k-item
  # scan. Those cost roughly eight minutes of runner time between them and
  # cannot fail on a change that touches no code.
  #
  # Only openapi is gated: web needs openapi, server needs web, gate1 needs
  # server, and a skipped dependency skips the chain. One condition, one place.
  #
  # The filter is wrong in the safe direction on purpose. Any push to main runs
  # everything, and any unrecognised path counts as code, so a pull request that
  # touches docs AND code still runs the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          echo "changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$)'; then
            echo "non-docs changes present; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs only; skipping build and test jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  openapi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - name: Fail if generated client drifted from OpenAPI
        run: git diff --exit-code -- src/lib/api/schema.d.ts

  web:
    needs: openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build

  server:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # FFmpeg tests must fail, not skip, when ffmpeg is missing in CI.
          NIGHTJAR_TEST_REQUIRE_FFMPEG: "1"
      - run: cargo build --release -p nightjar-api

  gate1:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build web for embed
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        working-directory: server
        run: cargo build --release -p nightjar-api
      - name: Generate corpus seeds
        run: chmod +x testdata/generate.sh testdata/bench_10k.sh scripts/gate1_ci.sh scripts/gate1_scan_10k.sh scripts/ci_benchmark_summary.py && ./testdata/generate.sh
      - name: Gate 1 smoke (startup, RAM, WAL kill-9, Range)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: ./scripts/gate1_ci.sh | tee /tmp/gate1_ci.txt
      - name: Gate 1 scan 10k
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
          SCAN_BUDGET_S: "60"
          # ADR-0004: floor catches half-speed regressions, not runner jitter.
          # ubuntu-latest often sits ~50 files/sec; 40 still fails a true halving.
          PROBE_FLOOR_FPS: "40"
        run: ./scripts/gate1_scan_10k.sh | tee /tmp/gate1_scan.txt
      - name: Benchmark delta (report only)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: |
          # Baseline is optional until notes/ci/gate-metrics-baseline.json is
          # seeded from a green main run (notes/ci/README.md). Missing file →
          # "no baseline" in the summary; do not invent null placeholders.
          args=(/tmp/gate1_ci.txt /tmp/gate1_scan.txt)
          if [[ -f notes/ci/gate-metrics-baseline.json ]]; then
            args+=(notes/ci/gate-metrics-baseline.json)
          fi
          python3 scripts/ci_benchmark_summary.py "${args[@]}" | tee /tmp/gate-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-metrics
          path: /tmp/gate-metrics.json
