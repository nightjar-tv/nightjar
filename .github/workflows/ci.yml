name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A docs-only pull request needs no Rust build, no node build and no 10k-item
  # scan. Those cost roughly eight minutes of runner time between them and
  # cannot fail on a change that touches no code.
  #
  # Only openapi is gated: web needs openapi, server needs web, gate1 needs
  # server, and a skipped dependency skips the chain. One condition, one place.
  #
  # The filter is wrong in the safe direction on purpose. Any push to main runs
  # everything, and any unrecognised path counts as code, so a pull request that
  # touches docs AND code still runs the full suite.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a pull request; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}')"
          echo "changed files:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qvE '(^docs/|\.md$)'; then
            echo "non-docs changes present; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs only; skipping build and test jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The release notice set is deterministic from the committed lockfiles and
  # notices/ material. This job needs no build and no Docker, so it runs on
  # every change, including docs-only changes that can break the notice route.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release notice set
        run: python3 scripts/check_notices.py check
      - name: Prove the notice checker can fail
        run: python3 scripts/check_notices.py selftest

  openapi:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run codegen
      - name: Fail if generated client drifted from OpenAPI
        run: git diff --exit-code -- src/lib/api/schema.d.ts

  web:
    needs: openapi
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/build

  server:
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web/build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # FFmpeg tests must fail, not skip, when ffmpeg is missing in CI.
          NIGHTJAR_TEST_REQUIRE_FFMPEG: "1"
      - run: cargo build --release -p nightjar-api

  gate1:
    needs: server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build web for embed
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        working-directory: server
        run: cargo build --release -p nightjar-api
      - name: Generate corpus seeds
        run: chmod +x testdata/generate.sh testdata/bench_10k.sh scripts/gate1_ci.sh scripts/gate1_scan_10k.sh scripts/ci_benchmark_summary.py && ./testdata/generate.sh
      - name: Gate 1 smoke (startup, RAM, WAL kill-9, Range)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: ./scripts/gate1_ci.sh | tee /tmp/gate1_ci.txt
      - name: Gate 1 scan 10k
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
          SCAN_BUDGET_S: "60"
          # ADR-0004: floor catches half-speed regressions, not runner jitter.
          # ubuntu-latest often sits ~50 files/sec; 40 still fails a true halving.
          PROBE_FLOOR_FPS: "40"
        run: ./scripts/gate1_scan_10k.sh | tee /tmp/gate1_scan.txt
      - name: Benchmark delta (report only)
        env:
          NIGHTJAR_BIN: ${{ github.workspace }}/server/target/release/nightjar
        run: |
          # Baseline is optional until notes/ci/gate-metrics-baseline.json is
          # seeded from a green main run (notes/ci/README.md). Missing file →
          # "no baseline" in the summary; do not invent null placeholders.
          args=(/tmp/gate1_ci.txt /tmp/gate1_scan.txt)
          if [[ -f notes/ci/gate-metrics-baseline.json ]]; then
            args+=(notes/ci/gate-metrics-baseline.json)
          fi
          python3 scripts/ci_benchmark_summary.py "${args[@]}" | tee /tmp/gate-metrics.json
      - uses: actions/upload-artifact@v4
        with:
          name: gate-metrics
          path: /tmp/gate-metrics.json

  # ADR-0056. Prove the linux/amd64 Docker path: build the image twice with no
  # shared cache and compare the governed inputs each build recorded. This
  # compares inputs, not output bytes; see docs/RELEASE.md. The native macOS
  # server is a separate artifact and is not built here.
  release-inputs:
    name: release-inputs (linux/amd64 Docker path)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the linux/amd64 image twice with no shared cache
        run: |
          set -euo pipefail
          docker buildx build --no-cache --platform linux/amd64 -t nightjar:repro-a .
          docker buildx build --no-cache --platform linux/amd64 -t nightjar:repro-b .
      - name: Capture one probe bundle per build
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/release-input-manifests"
          mkdir -p "$dir"
          capture() {
            tag="$1"
            out="$2"
            {
              echo "image_id: $(docker image inspect --format '{{.Id}}' "$tag")"
              docker run --rm --entrypoint sh "$tag" -c '
                echo "binary_sha256: $(sha256sum /usr/local/bin/nightjar | cut -d" " -f1)"
                echo "toolchain.node: $(sed -n 1p /etc/nightjar-release-inputs/toolchains-web.txt)"
                echo "toolchain.npm: $(sed -n 2p /etc/nightjar-release-inputs/toolchains-web.txt)"
                echo "toolchain.rust: $(sed -n 1p /etc/nightjar-release-inputs/toolchains-server.txt)"
                echo "toolchain.cargo: $(sed -n 2p /etc/nightjar-release-inputs/toolchains-server.txt)"
                dpkg-query -W -f="dpkg: \${binary:Package} \${Version} \${source:Package} \${source:Version} \${Architecture}\n"
                echo "ffmpeg_buildconf:"
                ffmpeg -buildconf
                echo "end_ffmpeg_buildconf"
              '
            } > "$out"
          }
          capture nightjar:repro-a "$dir/probe-a.txt"
          capture nightjar:repro-b "$dir/probe-b.txt"
      - name: Verify the notice set inside the built linux/amd64 image
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh nightjar:repro-a -c '
            set -e
            test -f /usr/share/doc/nightjar/NOTICE
            test -f /usr/share/doc/nightjar/SOURCE.md
            test -f /usr/share/doc/nightjar/notices/THIRD-PARTY.md
            test -f /usr/share/doc/nightjar/notices/Apache-2.0.txt
            test -f /usr/share/doc/nightjar/notices/hls.js-1.6.16.txt
            for pkg in ca-certificates ffmpeg intel-media-va-driver mesa-va-drivers i965-va-driver; do
              test -f "/usr/share/doc/nightjar/debian/$pkg/copyright"
            done
            grep -q "hls.js 1.6.16" /usr/share/doc/nightjar/NOTICE
          '
      - name: Emit both manifests
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/release-input-manifests"
          python3 scripts/check_release_inputs.py emit --out "$dir/manifest-a.json" --tree . --target x86_64-unknown-linux-gnu --probe "$dir/probe-a.txt"
          python3 scripts/check_release_inputs.py emit --out "$dir/manifest-b.json" --tree . --target x86_64-unknown-linux-gnu --probe "$dir/probe-b.txt"
      - name: Compare the two manifests
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/release-input-manifests"
          python3 scripts/check_release_inputs.py compare "$dir/manifest-a.json" "$dir/manifest-b.json" | tee "$dir/compare.txt"
      - name: Prove the comparator can fail
        run: |
          set -euo pipefail
          dir="${{ runner.temp }}/release-input-manifests"
          python3 scripts/check_release_inputs.py selftest | tee "$dir/controls.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-input-manifests
          path: ${{ runner.temp }}/release-input-manifests/
